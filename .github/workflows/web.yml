name: Build and deploy Fearless Knights of the Cordon (Godot Web)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python for manual map import
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Convert user Geo Lab survey to Godot coordinates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pyproj>=3.6,<4'
          python scripts/convert_editor_geojson.py data/manual_survey_2026-11-19.geojson --output godot/manual_layout.json
          python - <<'PY'
          import json
          d = json.load(open('godot/manual_layout.json', encoding='utf-8'))
          assert len(d['features']) == 710
          assert d['metadata']['type_counts']['house'] == 232
          assert d['metadata']['type_counts']['plot'] == 209
          assert d['metadata']['type_counts']['road'] == 20
          assert d['metadata']['type_counts']['car'] == 52
          assert any(f['id'] == 'a2273fc9-20b5-43a9-ab41-faccdc6283b3' and f['type'] == 'house' for f in d['features'])
          print('MANUAL_SOURCE_VERIFIED:', len(d['features']))
          PY

      - name: Convert Quest Lab project to Godot mission coordinates
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_convert_questlab.py
          python scripts/convert_questlab.py data/questlab_return_cordon.json --output godot/questlab_runtime.json
          python scripts/convert_questlab.py data/questlab_interactions_demo.json --output godot/questlab_interactions_demo.json
          python - <<'PY'
          import json
          doc = json.load(open('godot/questlab_runtime.json', encoding='utf-8'))
          assert doc['schema'] == 'chernozerye.questlab.runtime-1'
          assert len(doc['quests']) == 1 and len(doc['quests'][0]['steps']) == 2
          demo=json.load(open('godot/questlab_interactions_demo.json', encoding='utf-8'))
          assert demo['schema'] == 'chernozerye.questlab.runtime-1'
          assert len(demo['quests'])==1
          assert [s['type'] for s in demo['quests'][0]['steps']] == ['interact','collect','message']
          assert all(s['target_world'] is not None for s in demo['quests'][0]['steps'][:2])
          print('QUESTLAB_DATA_READY: authored=2 demo=3 interact=true collect=true')
          PY

      - name: Build separate full and FPS low-poly GLBs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'trimesh>=4.4,<5'
          python scripts/build_dembel_character.py godot/assets/dembel_full.glb
          python scripts/build_dembel_fps.py godot/assets/dembel_fp.glb
          test -s godot/assets/dembel_full.glb
          test -s godot/assets/dembel_fp.glb
          python scripts/check_dembel_character.py godot/assets/dembel_full.glb godot/assets/dembel_fp.glb

      - name: Restore user-exported Hellish Forge pistol GLB
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import struct
          from pathlib import Path

          # Preserve the exact GLB from Hellish Forge, not a procedurally
          # recreated placeholder. The repository stores XZ/base64 to
          # transport uploaded binary data through the GitHub connector.
          encoded = Path("data/forge_pistol.glb.xz.b64").read_text().strip()
          payload = lzma.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == "0eea0b0e3e61f41033df60b8e1b50933b743e87a07ce798e7c963bad1f256a6e", digest
          magic, version, size = struct.unpack_from("<III", payload, 0)
          assert magic == 0x46546C67 and version == 2 and size == len(payload)
          json_size, chunk = struct.unpack_from("<II", payload, 12)
          assert chunk == 0x4E4F534A
          data = json.loads(payload[20:20+json_size])
          assert len(data["meshes"]) == 11, "Uploaded mesh count changed"
          anchors = {n["name"] for n in data["nodes"] if n.get("name", "").startswith("HF_")}
          assert {"HF_GRIP_PRIMARY", "HF_FORWARD", "HF_MAGAZINE"} <= anchors
          destination = Path("godot/assets/forge_pistol.glb")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(payload)
          print("FORGE_UPLOAD_GLB_OK: bytes=", len(payload), "meshes=11 anchors=3 sha256=", digest)
          PY
          test -s godot/assets/forge_pistol.glb

      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION="4.7.2"
          RELEASE="https://github.com/godotengine/godot-builds/releases/download/${VERSION}-stable"
          curl -fL --retry 3 -o /tmp/godot.zip "${RELEASE}/Godot_v${VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 755 "/tmp/godot-bin/Godot_v${VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz "${RELEASE}/Godot_v${VERSION}-stable_export_templates.tpz"
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"
          godot --version

      - name: Import project
        run: godot --headless --path godot --editor --quit

      - name: Validate GDScript sources
        shell: bash
        run: |
          set -euo pipefail
          for script in world.gd player.gd forge_pistol.gd forge_pistol_regression.gd weapon_hand_viewmodel.gd geography_v07.gd live_map_v08.gd overture_3d_a.gd manual_geo.gd manual_art.gd izba_variants.gd logo_data.gd story_prologue.gd collision_regression.gd first_person_body.gd modeled_character.gd modeled_character_regression.gd fps_viewmodel.gd viewmodel_regression.gd gameplay_hud.gd character_smoking.gd revolver.gd revolver_cycle_regression.gd questlab_runtime.gd questlab_regression.gd questlab_playtest_marker.gd questlab_interaction_regression.gd pause_overlay.gd pause_regression.gd body_gait_regression.gd body_view_regression.gd; do
            echo "Checking ${script}"
            godot --headless --path godot --check-only --script "res://${script}"
          done

      - name: Regression-test curved roads and entrance clearance
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --script res://geometry_regression.gd 2>&1 | tee /tmp/geom-regression.log
          grep -q "GEOMETRY_REGRESSION_OK:" /tmp/geom-regression.log

      - name: Regression-test Chapter 1 interaction and journal
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --script res://prologue_regression.gd 2>&1 | tee /tmp/prologue-regression.log
          grep -q "PROLOGUE_REGRESSION_OK: surveyed_home=true room=true note=true mask=true exit=true cues=2 bearing=readable" /tmp/prologue-regression.log

      - name: Regression-test imported Quest Lab mission and F6 playtest
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --script res://questlab_regression.gd 2>&1 | tee /tmp/questlab-regression.log
          grep -q "QUESTLAB_REGRESSION_OK: imported=true spawn=true steps=2 sequential=true restored=true" /tmp/questlab-regression.log

      - name: Regression-test Quest Lab F7 object interaction and note collection
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --script res://questlab_interaction_regression.gd 2>&1 | tee /tmp/questlab-interactions.log
          grep -q "QUESTLAB_INTERACTION_REGRESSION_OK: f7=true marker=true interact=true collect=true distance_guard=true message=true original_f6=true restored=true" /tmp/questlab-interactions.log

      - name: Regression-test building and fence physics
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --script res://collision_regression.gd 2>&1 | tee /tmp/collision-regression.log
          grep -q "COLLISION_REGRESSION_OK: house=solid fence=solid gap=open capsule=blocked" /tmp/collision-regression.log
          grep -q "FIRST_PERSON_HUD_REGRESSION_OK: body=absent full_model=f4_only arms=item_only compass=NESW health=100 slots=4" /tmp/collision-regression.log
          grep -q "CHARACTER_SEQUENCE_REGRESSION_OK: selected_slot=required staged=true burn_seconds=120 hands_clear=true auto_discard=true no_buffs=true face_occluded_lookdown=true" /tmp/collision-regression.log

      - name: Regression-test first-person leg articulation
        run: |
          set -o pipefail
          godot --headless --path godot --script res://body_gait_regression.gd 2>&1 | tee /tmp/body-gait-regression.log
          grep -q "BODY_GAIT_REGRESSION_OK: upright_rest=true alternating_stride=true independent_knees=true level_boots=true idle_reset=true" /tmp/body-gait-regression.log

      - name: Regression-test visible boots against ground and coat
        run: |
          set -o pipefail
          godot --headless --path godot --script res://body_view_regression.gd 2>&1 | tee /tmp/body-view-regression.log
          grep -q "BODY_VIEW_REGRESSION_OK: soles_above_ground=true knees_visible=true two_boots_distinct=true coat_clearance=true upright_restored=true" /tmp/body-view-regression.log

      - name: Regression-test GLB character and fixed leg pivots
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --script res://modeled_character_regression.gd 2>&1 | tee /tmp/model-regression.log
          grep -q "MODELED_CHARACTER_REGRESSION_OK: fps_body_absent=true legacy_hidden=true unarmed_clear=true full_model_f4_only=true f4_roundtrip=true" /tmp/model-regression.log

      - name: Regression-test first-person viewmodel arms
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --script res://viewmodel_regression.gd 2>&1 | tee /tmp/viewmodel-regression.log
          grep -q "VIEWMODEL_REGRESSION_OK: item_only=true spread=true recoil=true" /tmp/viewmodel-regression.log

      - name: Regression-test Forge pistol and first-person hand profiles
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --script res://forge_pistol_regression.gd 2>&1 | tee /tmp/forge-pistol-regression.log
          grep -q "FORGE_PISTOL_REGRESSION_OK: uploaded_glb=true anchors=3 parts>=10 capacity=7 one_click=true reload=true original_revolver=true hands=2 fp_profile=true" /tmp/forge-pistol-regression.log

      - name: Regression-test two-click revolver cycle
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --script res://revolver_cycle_regression.gd 2>&1 | tee /tmp/revolver-cycle-regression.log
          grep -q "REVOLVER_CYCLE_REGRESSION_OK: clicks=12 shots=6 reload=true sfx=true" /tmp/revolver-cycle-regression.log

      - name: Regression-test pause and mouse sensitivity
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --script res://pause_regression.gd 2>&1 | tee /tmp/pause-regression.log
          grep -q "PAUSE_REGRESSION_OK: freeze=true resume=true sensitivity=1.5x persistent_in_session=true" /tmp/pause-regression.log

      - name: Smoke-test actual scene startup
        shell: bash
        run: |
          set -euo pipefail
          # Script validation alone cannot catch a Web scene frozen in _ready.
          timeout 90s godot --headless --path godot --quit-after 20 2>&1 | tee /tmp/world-smoke.log
          grep -q "WORLD_READY: geometry complete" /tmp/world-smoke.log
          grep -q "OVERTURE_3D_A_READY:" /tmp/world-smoke.log
          grep -q "MANUAL_LAYOUT_READY: 710" /tmp/world-smoke.log
          # Boot must already be in the manually surveyed village, without
          # a click on any preview/legacy map button.
          grep -q "FEARLESS_KNIGHTS_STARTUP_READY:" /tmp/world-smoke.log
          grep -q "STORY_PROLOGUE_READY:" /tmp/world-smoke.log
          grep -q "QUESTLAB_RUNTIME_READY: quests=1 steps=2 key=F6" /tmp/world-smoke.log
          grep -q "FIRST_PERSON_BODY_READY: torso=true legs=2 arms=2" /tmp/world-smoke.log
          grep -q "MODELED_CHARACTER_READY: fps_body=disabled full_body=f4_only fps_arms=independent" /tmp/world-smoke.log
          grep -q "CHARACTER_SEQUENCE_READY: cosmetic=true selected_slot_required=true duration=120 states=8" /tmp/world-smoke.log
          grep -q "SURVIVAL_HUD_READY: compass=center hp=100 hotbar=4 cigarette_pack=slot1" /tmp/world-smoke.log
          grep -q "manual_mode=true" /tmp/world-smoke.log
          grep -q "MANUAL_NIGHT_READY: true" /tmp/world-smoke.log
          grep -q "NOVEMBER_SNOW_READY: cpu=true amount=340 follow_player=true" /tmp/world-smoke.log
          grep -q "NOVEMBER_MUD_READY: patches=" /tmp/world-smoke.log
          grep -q "NOVEMBER_SMOKE_READY: active=" /tmp/world-smoke.log
          grep -q "ABANDONED_VILLAGE_LIGHTS_READY:" /tmp/world-smoke.log
          grep -q "VILLAGE_COLLISION_READY:" /tmp/world-smoke.log
          grep -q "FOREST_COLLISION_READY:" /tmp/world-smoke.log
          grep -q "CAMERA_CLIP_GUARD_READY:" /tmp/world-smoke.log
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path("/tmp/world-smoke.log").read_text()
          m = re.search(r"CAMERA_CLIP_GUARD_READY: near=([\d.]+) far=([\d.]+) radius=([\d.]+)", log)
          assert m, "Camera near-plane guard absent"
          near, far, radius = map(float, m.groups())
          assert 0.08 <= near <= 0.22, (near, "camera near plane risks clipping")
          assert near + 0.20 < radius, (near, radius, "camera plane outside capsule")
          assert far <= 280.0, (far, "depth buffer too imprecise in WebGL")
          print("CAMERA_CLIPPING_AUDIT_OK:", near, far, radius)
          PY
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/world-smoke.log').read_text()
          house = re.search(r'VILLAGE_COLLISION_READY: buildings=(\d+) fence_spans=(\d+) large_yard_props=(\d+)', log)
          tree = re.search(r'FOREST_COLLISION_READY: trunks=(\d+)', log)
          assert house and tree, "Collision diagnostics missing"
          buildings, fences, yard = map(int, house.groups())
          trunks = int(tree.group(1))
          assert buildings >= 397 and fences >= 100 and yard > 0 and trunks > 0, (buildings, fences, yard, trunks)
          print("VILLAGE_PHYSICS_AUDIT_OK:", buildings, fences, yard, trunks)
          PY
          grep -q "ABANDONMENT_FACADE_READY:" /tmp/world-smoke.log
          grep -q 'weather_label.name = "NovemberWeatherLabel"' godot/world.gd
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/world-smoke.log').read_text()
          x = re.search(r'NOVEMBER_MUD_READY: patches=(\d+) shallow_puddles=(\d+)', log)
          assert x, 'November mud detail counters absent'
          mud, puddles = map(int, x.groups())
          assert mud >= 25 and puddles > 0, ('November road texture insufficient', mud, puddles)
          smoke = re.search(r'NOVEMBER_SMOKE_READY: active=(\d+) candidates=(\d+)', log)
          assert smoke, 'No active chimney smoke diagnostic'
          active, candidates = map(int, smoke.groups())
          assert 0 <= active <= 1 and candidates >= active, ('Abandoned village has too many smoke plumes', active, candidates)
          houses = re.search(
              r'ABANDONED_VILLAGE_LIGHTS_READY: houses=(\d+) dark=(\d+)'
              r' warm_houses=(\d+) anomalous_houses=(\d+)'
              r' warm_windows=(\d+) otherworldly_windows=(\d+)', log)
          assert houses, 'Missing abandoned village illumination audit'
          total, dark, warm, eerie, warm_windows, eerie_windows = map(int, houses.groups())
          assert total == 232, ('Unexpected surveyed house count', total)
          assert dark >= 205 and warm <= 22 and eerie == 2, ('Village too inhabited', houses.groups())
          assert 7 <= warm_windows <= 22, ('Warm window distribution invalid', warm_windows)
          assert 1 <= eerie_windows <= 2, ('Unnatural light missing', eerie_windows)
          facade = re.search(
              r'ABANDONMENT_FACADE_READY: boarded_windows=(\d+)'
              r' sealed_entries=(\d+) anomaly_motes=(\d+)', log)
          assert facade, 'Missing decay facade counters'
          boarded, sealed, motes = map(int, facade.groups())
          assert boarded >= 15 and sealed >= 8, ('Abandoned houses look too intact', facade.groups())
          assert motes == 2, ('Only the two anomalous houses should emit dust', motes)
          yards = re.search(r'VILLAGE_YARDS_READY:.* collapsed_gate=(\d+)', log)
          assert yards and int(yards.group(1)) > 0, 'Broken gates missing from yards'
          flowers = re.search(r'MANUAL_UTILITY_READY:.*flower_patches=(\d+)', log)
          assert flowers and int(flowers.group(1)) < 40, 'Too many live garden flowers'
          print('ABANDONED_VILLAGE_AUDIT_OK:', dark, warm_windows, eerie_windows,
                'smoking=', active, 'boarded=', boarded, 'sealed=', sealed,
                'anomalies=', motes, 'collapsed_gates=', int(yards.group(1)))
          print('NOVEMBER_WEATHER_AUDIT_OK: mud=', mud, 'puddles=', puddles, 'smoke=', active)
          PY
          grep -q '^    _activate_default_village()' godot/world.gd
          grep -q 'config/name="Fearless Knights of the Cordon"' godot/project.godot
          grep -q "MANUAL_ART_READY: buildings=397 plots=209 roads=20" /tmp/world-smoke.log
          grep -q "MANUAL_VILLAGE_DETAIL_READY: canopies=" /tmp/world-smoke.log
          grep -q "MANUAL_FACADE_READY: lean_tos=" /tmp/world-smoke.log
          grep -q "IZBA_GENERATOR_READY: floor_counts=" /tmp/world-smoke.log
          grep -q "IZBA_DETAIL_READY: log_courses=" /tmp/world-smoke.log
          grep -q "VILLAGE_YARDS_READY: wells=" /tmp/world-smoke.log
          grep -q "VILLAGE_ENTRANCES_READY: reserved=" /tmp/world-smoke.log
          grep -q "MANUAL_STREETSCAPE_READY:" /tmp/world-smoke.log
          # Crossroads are detected before village art is built and must produce
          # some continuous intersection surfaces for the 20 surveyed roads.
          grep -q "MANUAL_ROAD_JUNCTIONS_READY: total=" /tmp/world-smoke.log
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/world-smoke.log').read_text()
          hits = re.findall(r'MANUAL_ROAD_JUNCTIONS_READY: total=(\d+)', log)
          assert hits and int(hits[-1]) > 0, ('No junction patches built', hits)
          print('JUNCTION_VISUAL_AUDIT_OK:', hits[-1])
          PY
          grep -q "VILLAGE_CLEARANCE_READY: rejected_fence_panels=" /tmp/world-smoke.log
          grep -q "FEARLESS_KNIGHTS_LOGO_READY:" /tmp/world-smoke.log
          # Guard against removing most plot boundaries again (v3.4 skipped 328).
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/world-smoke.log').read_text()
          m = re.search(
              r'VILLAGE_CLEARANCE_READY: rejected_fence_panels=(\d+)'
              r' total_fence_panels=(\d+) relocated_fence_panels=(\d+)'
              r'.* sealed_roof_joints=(\d+)',
              log)
          assert m, 'Missing village geometry counts'
          missing, attempted, relocated, sealed = map(int, m.groups())
          assert attempted > 0, 'No fence panels attempted'
          assert missing / attempted < 0.55, ('Most fence sections were lost', missing, attempted)
          assert relocated > 20, ('No roadside fence correction performed', relocated)
          assert sealed == 232, ('Unexpected house roof count', sealed)
          print('VILLAGE_GEOMETRY_AUDIT_OK:', missing, attempted, relocated, sealed)
          PY
          # Manual village mode is enabled by default during scene startup.
          # Assert the new twilight configuration without an artificial UI click.
          grep -q 'ambient_light_energy = 0.57 if manual_mode' godot/world.gd
          grep -q 'light_specular = 0.0' godot/world.gd
          grep -q "MANUAL_FOREST_READY: trees=" /tmp/world-smoke.log
          grep -q "clearance=roads13/buildings6.5" /tmp/world-smoke.log
          grep -q "MANUAL_SHOWCASE_YARD_READY:" /tmp/world-smoke.log
          grep -q "MANUAL_UTILITY_READY: poles=" /tmp/world-smoke.log
          if grep -E "SCRIPT ERROR|FATAL ERROR|out of memory" /tmp/world-smoke.log; then
            exit 1
          fi

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          # Immutable directory per commit. A static /pre-alpha-0.3.9/
          # was cached by some browsers even after a successful new publish.
          RELEASE_DIR="pre-alpha-0.5.4-${GITHUB_SHA:0:8}"
          mkdir -p "build/web/${RELEASE_DIR}"
          godot --headless --path godot --export-release "Web" "$(pwd)/build/web/${RELEASE_DIR}/index.html"
          test -s "build/web/${RELEASE_DIR}/index.html"
          test -f "build/web/${RELEASE_DIR}/index.wasm"
          test -f "build/web/${RELEASE_DIR}/index.pck"
          test -f "build/web/${RELEASE_DIR}/index.html"
          cat > build/web/index.html <<HTML
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=./${RELEASE_DIR}/">
            <meta name="robots" content="noindex">
            <title>Fearless Knights of the Cordon — Pre-Alpha 0.5.4</title>
          </head>
          <body>
            <p><a href="./${RELEASE_DIR}/">Открыть Fearless Knights of the Cordon — Pre-Alpha 0.5.4</a></p>
            <script>window.location.replace("./${RELEASE_DIR}/");</script>
          </body>
          </html>
          HTML
          echo "WEB_RELEASE_READY: ${RELEASE_DIR}"
          # Pages discards previous commit-specific directories during each
          # deployment. GitHub Pages serves 404.html for stale bookmarks, so
          # direct old links back to the stable root instead of a dead end.
          cat > build/web/404.html <<'HTML'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Чернозёрье — актуальная версия</title>
          </head>
          <body style="margin:0;background:#111827;color:#e5e7eb;font:16px system-ui,sans-serif">
            <main style="max-width:640px;margin:12vh auto;padding:24px">
              <h1>Старая ссылка на сборку</h1>
              <p>Игра обновилась. Актуальная версия доступна по постоянной ссылке.</p>
              <p><a style="color:#ffc27b" href="/chernozerye/">Перейти в Чернозёрье</a></p>
            </main>
            <script>
              // Redirect *only* retired HTML release links. Missing engine
              // resources keep a real 404 so broken builds are not hidden.
              var p = location.pathname.replace("/chernozerye/", "").split("/");
              if (p.length <= 2 && (p[0].startsWith("pre-alpha-") || /^v[0-9]+$/.test(p[0]))) {
                location.replace("/chernozerye/");
              }
            </script>
          </body>
          </html>
          HTML
          test -s build/web/index.html
          test -s build/web/404.html
          test -s "build/web/${RELEASE_DIR}/index.html"
          touch build/web/.nojekyll

      - name: Prepare the satellite geography viewer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build satellite overlay data and audit frontend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pyproj>=3.6,<4'
          python -m py_compile scripts/build_geo_viewer.py scripts/convert_editor_geojson.py
          python scripts/convert_editor_geojson.py tests/geo_lab_sample.geojson --output /tmp/chernozerye-manual-test.json
          python - <<'PY'
          import json
          doc = json.load(open('/tmp/chernozerye-manual-test.json', encoding='utf-8'))
          assert doc['metadata']['projection'] == 'EPSG:32640'
          assert len(doc['features']) == 3
          assert doc['metadata']['type_counts'] == {'road': 1, 'plot': 1, 'car': 1}
          center = next(x for x in doc['features'] if x['type'] == 'car')['points'][0]
          assert abs(center[0]) < .02 and abs(center[1]) < .02, center
          print('MANUAL_GODOT_IMPORT_OK:', len(doc['features']))
          PY
          node --check site/map/app.js
          node --check site/map/editor-core.js
          node --check site/map/editor.js
          node --test tests/editor-core.test.cjs
          # Quest Lab is deployed separately and must remain a working editor.
          node --check site/quest/quest-core.js
          node --check site/quest/quest.js
          node --test tests/quest-core.test.cjs
          node --check site/quest/geo-overlay-core.js
          node --test tests/quest-geo-overlay.test.cjs
          node --test tests/quest-geo-link.test.cjs
          grep -q 'quest.js?v=3' site/quest/index.html
          grep -q 'geo-overlay-core.js?v=2' site/quest/index.html
          grep -q 'id="tool-object"' site/quest/index.html
          grep -q 'id="geo-object-search"' site/quest/index.html
          grep -q '../map/editor-core.js?v=20' site/quest/index.html
          grep -q 'href="../quest/"' site/map/index.html
          mkdir -p build/web/quest
          cp -a site/quest/. build/web/quest/
          test -s build/web/quest/index.html
          test -s build/web/quest/quest.js
          test -s build/web/quest/quest-core.js
          test -s build/web/quest/geo-overlay-core.js
          # Model Lab: model format and control logic must pass before deployment.
          node --check site/model/model-core.js
          node --check site/model/model.mjs
          node --test tests/model-core.test.cjs
          grep -q 'model.mjs?v=1' site/model/index.html
          grep -q 'href="../model/"' site/quest/index.html
          grep -q 'href="../model/"' site/map/index.html
          mkdir -p build/web/model
          cp -a site/model/. build/web/model/
          test -s build/web/model/index.html
          test -s build/web/model/model.mjs
          test -s build/web/model/model-core.js
          # Hellish Forge is a distinct fictional-game asset editor with marker metadata.
          node --check site/forge/forge-core.js
          node --check site/forge/forge.mjs
          node --test tests/forge-core.test.cjs
          grep -q 'forge.mjs?v=2' site/forge/index.html
          grep -q 'forge-core.js?v=2' site/forge/index.html
          grep -q 'id="fp-preview-toggle"' site/forge/index.html
          grep -q 'id="fp-scale-slider"' site/forge/index.html
          node - <<'NODE'
          const fs = require("node:fs");
          const assert = require("node:assert/strict");
          const forge = require("./site/forge/forge-core.js");
          const profile = JSON.parse(fs.readFileSync("godot/assets/forge_pistol.viewmodel.json", "utf8"));
          assert.equal(profile.format, "chernozerye.forge.viewmodel");
          assert.equal(profile.version, 1);
          assert.deepEqual(profile.viewmodel, forge.normalizeViewmodel(profile.viewmodel));
          assert.equal(profile.viewmodel.scale, 0.32);
          assert.deepEqual(profile.viewmodel.position, [0.285,-0.225,-0.47]);
          assert.deepEqual(profile.viewmodel.rotation, [0,9,0]);
          assert.deepEqual(profile.viewmodel.hand_position, [-0.01,0.06,-0.01]);
          assert.deepEqual(profile.viewmodel.hand_rotation, [0,0,0]);
          console.log("FORGE_VIEWMODEL_PROFILE_OK: user_pose=true scale=0.32 hand=true");
          NODE
          mkdir -p build/web/forge
          cp -a site/forge/. build/web/forge/
          test -s build/web/forge/index.html
          test -s build/web/forge/forge-core.js
          test -s build/web/forge/forge.mjs
          # Studio embeds all four editors without deleting existing local drafts.
          node --check site/studio/studio-state.js
          node --check site/studio/studio.js
          node --check site/studio/release-core.js
          node --check site/studio/studio-releases.js
          node --test tests/studio-state.test.cjs
          node --test tests/studio-releases.test.cjs
          grep -q 'studio-state.js?v=1' site/studio/index.html
          grep -q 'release-core.js?v=1' site/studio/index.html
          grep -q 'studio-releases.js?v=1' site/studio/index.html
          grep -q 'studio.css?v=4' site/studio/index.html
          grep -q 'studio.js?v=3' site/studio/index.html
          grep -q 'id="release-list"' site/studio/index.html
          grep -q 'id="roadmap-list"' site/studio/index.html
          grep -q 'id="rail-toggle"' site/studio/index.html
          grep -q 'href="../studio/"' site/map/index.html
          grep -q 'href="../studio/"' site/quest/index.html
          grep -q 'href="../studio/"' site/model/index.html
          mkdir -p build/web/studio
          cp -a site/studio/. build/web/studio/
          test -s build/web/studio/index.html
          test -s build/web/studio/studio-state.js
          test -s build/web/studio/studio.js
          test -s build/web/studio/releases.json
          test -s build/web/studio/release-core.js
          test -s build/web/studio/studio-releases.js
          python - <<'PY'
          import datetime
          import json
          import os
          import re
          from pathlib import Path
          manifest=json.loads(Path("site/studio/releases.json").read_text(encoding="utf-8"))
          version=manifest["current"]["studio"]
          sha=os.environ["GITHUB_SHA"]
          assert re.fullmatch(r"[a-f0-9]{40}",sha), sha
          assert version=="0.5.0", "Unexpected Studio release number"
          info={"commit":sha,"studioVersion":version,
                "builtAtUtc":datetime.datetime.now(datetime.timezone.utc).isoformat()}
          Path("build/web/studio/build-meta.json").write_text(
              json.dumps(info,ensure_ascii=False,indent=2)+"\n", encoding="utf-8")
          print("STUDIO_RELEASE_DESK_BUILD_READY: version=",version,
                " releases=",len(manifest["releases"]),
                " backlog=",len(manifest["roadmap"])," commit=",sha[:8])
          PY
          test -s build/web/studio/build-meta.json
          grep -q 'QuestGeoOverlayRefresh' build/web/studio/studio.js
          grep -q 'data-target="forge"' site/studio/index.html
          grep -q 'editor.js?v=20' site/map/index.html
          grep -q 'editor-core.js?v=20' site/map/index.html
          mkdir -p build/web/map
          cp -a site/map/. build/web/map/
          python scripts/build_geo_viewer.py
          test -s build/web/map/index.html
          test -s build/web/map/data/overture.geojson
          test -s build/web/map/data/roads.geojson
          test -s build/web/map/data/study-areas.geojson
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/web/map/data")
          features = json.loads((root/"overture.geojson").read_text())["features"]
          roads = json.loads((root/"roads.geojson").read_text())["features"]
          assert len(features) >= 1000, "Unexpected building count"
          assert len(roads) >= 10, "No roads"
          for feature in features:
              geom = feature["geometry"]
              assert geom["type"] == "Polygon"
              for lon, lat in geom["coordinates"][0]:
                  assert 55.7 < lon < 56.0 and 54.5 < lat < 54.9, "Invalid WGS84 coordinate"
          print("MAP_GEO_AUDIT_OK:", len(features), "building footprints,", len(roads), "roads")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: export
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Pages entry and active game build
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          # Deployment success only confirms artifact upload. Verify the live
          # HTTP endpoint and the exact hash-specific Godot directory as well.
          RELEASE_DIR="pre-alpha-0.5.4-${GITHUB_SHA:0:8}"
          SITE_URL="${SITE_URL%/}/"
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 20 --retry 2 --retry-delay 2 "${SITE_URL}?build=${GITHUB_SHA:0:8}" -o /tmp/pages-root.html \
              && grep -q 'window.location.replace' /tmp/pages-root.html \
              && curl -fsSL --max-time 20 "${SITE_URL}${RELEASE_DIR}/index.html" -o /tmp/pages-game.html \
              && test -s /tmp/pages-game.html \
              && curl -fsSL --max-time 20 "${SITE_URL}quest/index.html" -o /tmp/pages-quest.html \
              && grep -q 'QUEST LAB' /tmp/pages-quest.html \
              && curl -fsSL --max-time 20 "${SITE_URL}model/index.html" -o /tmp/pages-model.html \
              && grep -q 'MODEL LAB' /tmp/pages-model.html \
              && curl -fsSL --max-time 20 "${SITE_URL}forge/index.html" -o /tmp/pages-forge.html \
              && grep -q 'HELLISH FORGE' /tmp/pages-forge.html \
              && curl -fsSL --max-time 20 "${SITE_URL}forge/forge-core.js" -o /tmp/pages-forge-core.js \
              && grep -q 'chernozerye.hellish-forge' /tmp/pages-forge-core.js \
              && curl -fsSL --max-time 20 "${SITE_URL}studio/index.html" -o /tmp/pages-studio.html \
              && grep -q 'CHERNOZERYE' /tmp/pages-studio.html \
              && curl -fsSL --max-time 20 "${SITE_URL}studio/studio.js" -o /tmp/pages-studio.js \
              && grep -q 'CHERNOZERYE_STUDIO_READY' /tmp/pages-studio.js \
              && curl -fsSL --max-time 20 "${SITE_URL}studio/releases.json" -o /tmp/pages-studio-releases.json \
              && grep -q '"studio": "0.5.0"' /tmp/pages-studio-releases.json \
              && curl -fsSL --max-time 20 "${SITE_URL}studio/build-meta.json" -o /tmp/pages-studio-build-meta.json \
              && grep -q "${GITHUB_SHA}" /tmp/pages-studio-build-meta.json; then
              echo "LIVE_PAGES_OK: ${SITE_URL}, ${SITE_URL}${RELEASE_DIR}/, geo/, quest/, model/, forge/, studio/"
              exit 0
            fi
            echo "Public Pages check ${attempt}/12 not ready"
            sleep 5
          done
          echo "::error::GitHub Pages deployed but its public index or game build returned 404"
          exit 1
