                    const aby = b.y - a.y;
                    const abz = b.z - a.z;
                    const lenSq = abx * abx + aby * aby + abz * abz;
                    if (lenSq < 1e-10) return out.copy(a);
                    let t = ((p.x - a.x) * abx + (p.y - a.y) * aby + (p.z - a.z) * abz) / lenSq;
                    t = Math.max(0, Math.min(1, t));
                    return out.set(a.x + abx * t, a.y + aby * t, a.z + abz * t);
                }

                function enforceOutwardWinding(geo, spinePoints) {
                    const pos = geo.attributes.position;
                    const index = geo.index;
                    if (!pos || !index) {
                        geo.computeVertexNormals();
                        return geo;
                    }

                    const arr = index.array;
                    const va = new THREE.Vector3();
                    const vb = new THREE.Vector3();
                    const vc = new THREE.Vector3();
                    const cb = new THREE.Vector3();
                    const ab = new THREE.Vector3();
                    const centroid = new THREE.Vector3();
                    const refPt = new THREE.Vector3();
                    const candPt = new THREE.Vector3();

                    if (!spinePoints || spinePoints.length === 0) {
                        geo.computeBoundingBox();
                        geo.boundingBox.getCenter(refPt);
                    }

                    for (let i = 0; i < arr.length; i += 3) {
                        const i0 = arr[i], i1 = arr[i + 1], i2 = arr[i + 2];
                        va.fromBufferAttribute(pos, i0);
                        vb.fromBufferAttribute(pos, i1);
                        vc.fromBufferAttribute(pos, i2);

                        cb.subVectors(vc, vb);
                        ab.subVectors(va, vb);
                        cb.cross(ab);

                        centroid.copy(va).add(vb).add(vc).multiplyScalar(1 / 3);

                        if (spinePoints && spinePoints.length >= 2) {
                            let bestDistSq = Infinity;
                            for (let s = 0; s < spinePoints.length - 1; s++) {
                                closestPointOnSegment(centroid, spinePoints[s], spinePoints[s + 1], candPt);
                                const dSq = centroid.distanceToSquared(candPt);
                                if (dSq < bestDistSq) {
                                    bestDistSq = dSq;
                                    refPt.copy(candPt);
                                }
                            }
                        } else if (spinePoints && spinePoints.length === 1) {
                            refPt.copy(spinePoints[0]);
                        }

                        const outVec = centroid.clone().sub(refPt);
                        if (cb.dot(outVec) < 0) {
                            arr[i + 1] = i2;
                            arr[i + 2] = i1;
                        }
                    }

                    index.needsUpdate = true;
                    geo.computeVertexNormals();
                    return geo;
                }

                // Lofted curved trunk / branch / root along spinePoints with strict outward CCW winding
                function createCurvedTrunkGeo(spinePoints, radii, radialSegs, closeCap) {
                    const segs = radialSegs || 7;
                    const cols = segs + 1;
                    const pos = [];
                    const uvs = [];
                    const indices = [];

                    let prevUp = new THREE.Vector3(0, 0, 1);

                    for (let i = 0; i < spinePoints.length; i++) {
                        const p = spinePoints[i];
                        const r = radii[i];
                        const tan = new THREE.Vector3();
                        if (i === 0) tan.subVectors(spinePoints[1], spinePoints[0]);
                        else if (i === spinePoints.length - 1) tan.subVectors(spinePoints[i], spinePoints[i - 1]);
                        else tan.subVectors(spinePoints[i + 1], spinePoints[i - 1]);
                        if (tan.lengthSq() < 1e-8) tan.set(0, 1, 0);
                        tan.normalize();

                        if (Math.abs(tan.dot(prevUp)) > 0.94) {
                            prevUp.set(1, 0, 0);
                            if (Math.abs(tan.dot(prevUp)) > 0.94) prevUp.set(0, 0, 1);
                        }
                        const right = new THREE.Vector3().crossVectors(prevUp, tan).normalize();
                        const orthoUp = new THREE.Vector3().crossVectors(tan, right).normalize();
                        prevUp.copy(orthoUp);

                        const vCoord = (i / Math.max(1, spinePoints.length - 1)) * 2.5;
                        for (let s = 0; s <= segs; s++) {
                            const u = s / segs;
                            const ang = u * Math.PI * 2;
                            const ca = Math.cos(ang);
                            const sa = Math.sin(ang);
                            const vx = p.x + (right.x * ca + orthoUp.x * sa) * r;
                            const vy = p.y + (right.y * ca + orthoUp.y * sa) * r;
                            const vz = p.z + (right.z * ca + orthoUp.z * sa) * r;
                            pos.push(vx, vy, vz);
                            uvs.push(u * 1.5, vCoord);
                        }
                    }

                    for (let i = 0; i < spinePoints.length - 1; i++) {
                        for (let s = 0; s < segs; s++) {
                            const a = i * cols + s;
                            const b = a + 1;
                            const c = (i + 1) * cols + s;
                            const d = c + 1;
                            indices.push(a, b, c);
                            indices.push(b, d, c);
                        }
                    }

                    if (closeCap) {
                        const topIdx = pos.length / 3;
                        const lastP = spinePoints[spinePoints.length - 1];
                        const lastRing = (spinePoints.length - 1) * cols;
                        pos.push(lastP.x, lastP.y, lastP.z);
                        uvs.push(0.5, 2.5);
                        for (let s = 0; s < segs; s++) {
                            indices.push(topIdx, lastRing + s, lastRing + s + 1);
                        }
                    }

                    const geo = new THREE.BufferGeometry();
                    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
                    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
                    geo.setIndex(indices);
                    return enforceOutwardWinding(geo, spinePoints);
                }

                // Cohesive multi-lobed low-poly organic foliage cluster (shared vertices displace identically -> zero gaps!)
                function createFoliageBlobGeo(rx, ry, rz, detail, seed) {
                    const geo = new THREE.IcosahedronGeometry(1.0, detail || 1);
                    const pos = geo.attributes.position;
                    const v = new THREE.Vector3();
                    for (let i = 0; i < pos.count; i++) {
                        v.fromBufferAttribute(pos, i);
                        const dir = v.clone().normalize();
                        const lobe = 0.84 + 0.24 * Math.sin(dir.x * 3.4 + seed) * Math.cos(dir.z * 3.1 - seed * 0.7)
                            + 0.10 * Math.sin(dir.y * 4.2 + seed * 1.3);
                        pos.setXYZ(i, dir.x * rx * lobe, dir.y * ry * lobe, dir.z * rz * lobe);
                    }
                    geo.computeVertexNormals();
                    return geo;
                }

                // Jagged drooping conifer skirt tier for Norway Spruce
                function createSpruceTierGeo(radius, height, seed) {
                    const segs = 12;
                    const pos = [];
                    const uvs = [];
                    const indices = [];

                    pos.push(0, height * 0.55, 0);
                    uvs.push(0.5, 1.0);

                    for (let s = 0; s <= segs; s++) {
                        const u = s / segs;
                        const ang = u * Math.PI * 2;
                        const bough = (s % 2 === 0) ? 1.12 : 0.82;
                        const r = radius * bough;
                        const droop = (s % 2 === 0) ? -height * 0.48 : -height * 0.30;
                        pos.push(Math.cos(ang) * r, droop, Math.sin(ang) * r);
                        uvs.push(u * 2, 0.2);
                    }

                    pos.push(0, -height * 0.28, 0);
                    uvs.push(0.5, 0.0);
                    const botIdx = pos.length / 3 - 1;

                    for (let s = 0; s < segs; s++) {
                        indices.push(0, s + 2, s + 1);
                        indices.push(botIdx, s + 1, s + 2);
                    }

                    const geo = new THREE.BufferGeometry();
                    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
                    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
                    geo.setIndex(indices);
                    return enforceOutwardWinding(geo, [new THREE.Vector3(0, -height * 0.25, 0), new THREE.Vector3(0, height * 0.45, 0)]);
                }

                // Tapered volumetric weeping willow drape (closed 3D geometry, never flat boards)
                function createWillowCurtainGeo(topR, botR, dropLen, seed) {
                    const pts = [
                        new THREE.Vector3(0, 0, 0),
                        new THREE.Vector3(0.04, -dropLen * 0.45, 0.03),
                        new THREE.Vector3(0.06, -dropLen, 0.05)
                    ];
                    return createCurvedTrunkGeo(pts, [topR, (topR + botR) * 0.55, botR], 6, true);
                }

                // Explicit double-sided serrated arched fern frond (upper +Y and lower -Y faces)
                function createSolidFernFrondGeo(len, width, archH) {
                    const segs = 6;
                    const pos = [];
                    const uvs = [];
                    const indices = [];

                    for (let i = 0; i <= segs; i++) {
                        const t = i / segs;
                        const z = -t * len;
                        const y = Math.sin(t * Math.PI * 0.82) * archH - t * t * (archH * 0.45);
                        const env = Math.sin(Math.pow(t, 0.72) * Math.PI);
                        const serration = (i > 0 && i < segs && i % 2 === 1) ? 1.18 : 0.88;
                        const w = Math.max(0.004, width * 0.5 * env * serration);

                        pos.push(-w, y - 0.006, z);
                        uvs.push(0, t);
                        pos.push(0, y + 0.006, z);
                        uvs.push(0.5, t);
                        pos.push(w, y - 0.006, z);
                        uvs.push(1, t);
                    }

                    for (let i = 0; i < segs; i++) {
                        const r0 = i * 3;
                        const r1 = (i + 1) * 3;
                        const l0 = r0, c0 = r0 + 1, rt0 = r0 + 2;
                        const l1 = r1, c1 = r1 + 1, rt1 = r1 + 2;

                        // Upper (+Y) faces
                        indices.push(l0, l1, c0);
                        indices.push(c0, l1, c1);
                        indices.push(c0, c1, rt0);
                        indices.push(rt0, c1, rt1);

                        // Explicit opposite-wound (-Y) underside faces
                        indices.push(l0, c0, l1);
                        indices.push(c0, c1, l1);
                        indices.push(c0, rt0, c1);
                        indices.push(rt0, rt1, c1);
                    }

                    const geo = new THREE.BufferGeometry();
                    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
                    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
                    geo.setIndex(indices);
                    geo.computeVertexNormals();
                    return geo;
                }

                // Properly wound Hollow Rotten Stump (Outward outer bark, Inward hollow cavity, Upward top rim)
                function createHollowStumpGeo(rOuterBase, rOuterTop, height, seed) {
                    const r = prng(seed);
                    const radialSegs = 12;
                    const hSegs = 4;
                    const cols = radialSegs + 1;
                    const pos = [];
                    const uvs = [];
                    const indices = [];

                    const outerRadii = [];
                    const innerRadii = [];
                    const yLevels = [];

                    for (let h = 0; h <= hSegs; h++) {
                        const t = h / hSegs;
                        yLevels.push(t * height);
                        outerRadii.push([]);
                        innerRadii.push([]);
                        for (let s = 0; s <= radialSegs; s++) {
                            const ang = (s / radialSegs) * Math.PI * 2;
                            const flare = Math.pow(1 - t, 2.2) * 0.14 * (0.7 + 0.5 * Math.sin(ang * 3 + seed));
                            const jag = (h === hSegs) ? (r() - 0.5) * 0.04 : 0;
                            const ro = (rOuterBase + (rOuterTop - rOuterBase) * t) + flare + jag;
                            const ri = ro * 0.62;
                            outerRadii[h].push(ro);
                            innerRadii[h].push(ri);
                        }
                    }

                    // 1. Outer Bark Wall (outward CCW)
                    for (let h = 0; h <= hSegs; h++) {
                        const y = yLevels[h];
                        for (let s = 0; s <= radialSegs; s++) {
                            const u = s / radialSegs;
                            const ang = u * Math.PI * 2;
                            const ro = outerRadii[h][s];
                            const topJagY = (h === hSegs) ? y + Math.sin(ang * 4 + seed) * 0.05 : y;
                            pos.push(Math.cos(ang) * ro, topJagY, Math.sin(ang) * ro);
                            uvs.push(u * 2, h / hSegs);
                        }
                    }
                    for (let h = 0; h < hSegs; h++) {
                        for (let s = 0; s < radialSegs; s++) {
                            const a = h * cols + s;
                            const b = a + 1;
                            const c = (h + 1) * cols + s;
                            const d = c + 1;
                            indices.push(a, c, b);
                            indices.push(b, c, d);
                        }
                    }

                    // 2. Inner Hollow Cavity Wall (inward CCW)
                    const innerOffset = pos.length / 3;
                    for (let h = 0; h <= hSegs; h++) {
                        const t = h / hSegs;
                        const y = 0.06 + t * (height - 0.06);
                        for (let s = 0; s <= radialSegs; s++) {
                            const u = s / radialSegs;
                            const ang = u * Math.PI * 2;
                            const ri = innerRadii[h][s];
                            const topJagY = (h === hSegs) ? yLevels[h] + Math.sin(ang * 4 + seed) * 0.05 : y;
                            pos.push(Math.cos(ang) * ri, topJagY, Math.sin(ang) * ri);
                            uvs.push(u * 2, t);
                        }
                    }
                    for (let h = 0; h < hSegs; h++) {
                        for (let s = 0; s < radialSegs; s++) {
                            const a = innerOffset + h * cols + s;
                            const b = a + 1;
                            const c = innerOffset + (h + 1) * cols + s;
                            const d = c + 1;
                            indices.push(a, b, c);
                            indices.push(b, d, c);
                        }
                    }

                    // 3. Top Cut Rim (+Y normal)
                    const outerTopStart = hSegs * cols;
                    const innerTopStart = innerOffset + hSegs * cols;
                    for (let s = 0; s < radialSegs; s++) {
                        const o0 = outerTopStart + s;
                        const o1 = outerTopStart + s + 1;
                        const i0 = innerTopStart + s;
                        const i1 = innerTopStart + s + 1;
                        indices.push(o0, i0, o1);
                        indices.push(o1, i0, i1);
                    }

                    // 4. Inner Cavity Floor Cap (+Y normal)
                    const floorCenterIdx = pos.length / 3;
                    pos.push(0, 0.06, 0);
                    uvs.push(0.5, 0.5);
                    for (let s = 0; s < radialSegs; s++) {
                        indices.push(floorCenterIdx, innerOffset + s + 1, innerOffset + s);
                    }

                    const geo = new THREE.BufferGeometry();
                    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
                    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
                    geo.setIndex(indices);
                    geo.computeVertexNormals();

                    function getOuterRadiusAt(yNorm, angle) {
                        const t = Math.max(0, Math.min(1, yNorm));
                        const flare = Math.pow(1 - t, 2.2) * 0.14 * (0.7 + 0.5 * Math.sin(angle * 3 + seed));
                        return (rOuterBase + (rOuterTop - rOuterBase) * t) + flare;
                    }

                    return { geo: geo, getOuterRadiusAt: getOuterRadiusAt };
                }

                // Cultist Black Sap creeping vines (clean, NO white masks/totems!)
                let pulsingSapMeshes = [];
                let pulsingRuneMeshes = [];

                function addCultistVines(parent, baseR, height, seed) {
                    const r = prng(seed);
                    const vineMat = makeMat({ color: 0x161214, roughness: 0.94 });
                    const veinMat = makeMat({ color: 0x8c1922, emissive: 0x590c12, emissiveIntensity: 0.72, roughness: 0.5 });

                    for (let v = 0; v < 3; v++) {
                        const pts = [];
                        const rads = [];
                        let ang = (v / 3) * Math.PI * 2 + r() * 0.6;
                        const steps = 6;
                        for (let i = 0; i <= steps; i++) {
                            const t = i / steps;
                            const y = t * height;
                            const rad = baseR * (1 - t * 0.45) + 0.025;
                            pts.push(new THREE.Vector3(Math.cos(ang) * rad, y, Math.sin(ang) * rad));
                            rads.push(Math.max(0.018, 0.055 * (1 - t * 0.55)));
                            ang += 0.65 + (r() - 0.5) * 0.25;
                        }
                        const mesh = new THREE.Mesh(createCurvedTrunkGeo(pts, rads, 6, true), v === 1 ? veinMat : vineMat);
                        parent.add(mesh);
                        if (v === 1) pulsingSapMeshes.push(mesh);
                    }
                }

                /* ---------------------------------------------------------
                   5.5 CATEGORY 1: TREES (Tree_Root, 9 SPECIES)
                   --------------------------------------------------------- */
                function buildTree() {
                    const t = state.tree;
                    const env = state.envState;
                    const r = prng(t.seed * 37 + t.species * 11 + 5);

                    const root = new THREE.Group();
                    root.name = 'Tree_Root';

                    const trunkGrp = new THREE.Group(); trunkGrp.name = 'Trunk_Base';
                    const canopyGrp = new THREE.Group(); canopyGrp.name = 'Foliage_Cap';
                    const corruptGrp = new THREE.Group(); corruptGrp.name = 'Corruption_Details';
                    root.add(trunkGrp, canopyGrp, corruptGrp);

                    const hScale = [0.74, 1.0, 1.34][t.height];
                    const sp = t.species;

                    // Select Bark Material (burned = pure charredWood without yellow strips!)
                    let barkTex = TEX.oak;
                    if (sp === 0 || sp === 5) barkTex = TEX.birch;
                    else if (sp === 1) barkTex = TEX.pine;
                    else if (sp === 2) barkTex = TEX.spruce;
                    else if (sp === 8) barkTex = TEX.sapWood;

                    if (env === 'd') barkTex = TEX.charredWood;
                    else if (env === 'c') barkTex = TEX.sapWood;

                    const barkMat = makeMat({ map: barkTex, color: env === 'd' ? 0xffffff : envTint() });

                    // Select Foliage Material
                    let folTex = TEX.foliageGreen;
                    if (sp === 1 || sp === 2) folTex = TEX.needles;
                    else if (sp === 5) folTex = TEX.aspenGold;
                    else if (sp === 6) folTex = TEX.willowLeaf;
                    else if (t.canopy === 1) folTex = TEX.foliageAutumn;

                    const folColor = env === 'd' ? 0x3b2c22 : (env === 'c' ? 0x5c2c32 : 0xffffff);
                    const folMat = makeMat({ map: folTex, color: folColor });

                    const showFoliage = (sp !== 4) && (t.canopy !== 2) && !(env === 'd' && t.canopy === 1);
                    const cScale = t.canopy === 1 ? 0.82 : 1.0;

                    // 8/9 Поваленный ветровал (sp === 7)
                    if (sp === 7) {
                        const len = 3.6 * hScale;
                        const pts = [
                            new THREE.Vector3(-len * 0.42, 0.34, 0),
                            new THREE.Vector3(-len * 0.12, 0.28, 0.12),
                            new THREE.Vector3( len * 0.18, 0.24, -0.08),
                            new THREE.Vector3( len * 0.48, 0.18, 0.05)
                        ];
                        const rads = [0.24 * hScale, 0.20 * hScale, 0.16 * hScale, 0.10 * hScale];
                        trunkGrp.add(new THREE.Mesh(createCurvedTrunkGeo(pts, rads, 7, true), barkMat));

                        const rootDisc = new THREE.Mesh(createFoliageBlobGeo(0.28, 0.68 * hScale, 0.65 * hScale, 1, t.seed + 40), makeMat({ map: TEX.forestFloor }));
                        rootDisc.position.set(-len * 0.44, 0.56 * hScale, 0);
                        trunkGrp.add(rootDisc);

                        for (let k = 0; k < 5; k++) {
                            const ang = (k / 5) * Math.PI * 2;
                            const rPts = [
                                new THREE.Vector3(-len * 0.44, 0.55 * hScale, 0),
                                new THREE.Vector3(-len * 0.58, 0.55 * hScale + Math.sin(ang) * 0.52, Math.cos(ang) * 0.52)
                            ];
                            trunkGrp.add(new THREE.Mesh(createCurvedTrunkGeo(rPts, [0.06, 0.02], 5, true), barkMat));
                        }

                        if (showFoliage) {
                            const blob = new THREE.Mesh(createFoliageBlobGeo(0.85 * hScale, 0.52 * hScale, 0.72 * hScale, 1, t.seed + 9), folMat);
                            blob.position.set(len * 0.36, 0.48 * hScale, 0);
                            canopyGrp.add(blob);
                        }
                        if (env === 'c') addCultistVines(corruptGrp, 0.25, 1.4, t.seed + 88);
                        return root;
                    }

                    // 2/9 Сосна (sp === 1): Natural S-curved bare lower 68% trunk, 5 root buttresses, bark knots, and layered umbrella crown
                    if (sp === 1) {
                        const totalH = 4.35 * hScale;
                        const baseR = 0.23 * hScale;
                        const leanX = (r() - 0.5) * 0.28 * hScale;
                        const leanZ = (r() - 0.5) * 0.24 * hScale;
                        const spine = [
                            new THREE.Vector3(0, 0, 0),
                            new THREE.Vector3(-leanX * 0.35, totalH * 0.25, leanZ * 0.30),
                            new THREE.Vector3(leanX * 0.45, totalH * 0.55, -leanZ * 0.25),
                            new THREE.Vector3(leanX * 0.85, totalH * 0.80, leanZ * 0.65),
                            new THREE.Vector3(leanX, totalH * 0.96, leanZ)
                        ];
                        trunkGrp.add(new THREE.Mesh(createCurvedTrunkGeo(spine, [baseR, baseR * 0.72, baseR * 0.52, baseR * 0.34, 0.06 * hScale], 8, true), barkMat));

                        // 5 flared root buttresses
                        for (let rt = 0; rt < 5; rt++) {
                            const ang = (rt / 5) * Math.PI * 2 + r() * 0.35;
                            const rPts = [
                                new THREE.Vector3(Math.cos(ang) * baseR * 0.45, 0.34 * hScale, Math.sin(ang) * baseR * 0.45),
                                new THREE.Vector3(Math.cos(ang) * baseR * 1.45, 0.10, Math.sin(ang) * baseR * 1.45),
                                new THREE.Vector3(Math.cos(ang) * baseR * 2.10, 0.0, Math.sin(ang) * baseR * 2.10)
                            ];
                            trunkGrp.add(new THREE.Mesh(createCurvedTrunkGeo(rPts, [baseR * 0.36, baseR * 0.20, 0.02], 5, true), barkMat));
                        }

                        // Lower dry bark knot stubs along bare trunk
                        for (let k = 0; k < 4; k++) {
                            const kf = 0.28 + k * 0.11;
                            const kang = k * 2.4 + r() * 0.6;
                            const kOrig = new THREE.Vector3(
                                leanX * (kf - 0.2),
                                totalH * kf,
                                leanZ * (kf - 0.2)
                            );
                            const kTip = new THREE.Vector3(
                                kOrig.x + Math.cos(kang) * 0.22 * hScale,
                                kOrig.y - 0.04 * hScale,
                                kOrig.z + Math.sin(kang) * 0.22 * hScale
                            );
                            trunkGrp.add(new THREE.Mesh(createCurvedTrunkGeo([kOrig, kTip], [0.032 * hScale, 0.012 * hScale], 5, true), barkMat));
                        }

                        // Upper crooked boughs at 72%..95% height
                        const boughTips = [];
                        for (let b = 0; b < 5; b++) {
                            const frac = 0.72 + (b / 5) * 0.20;
                            const orig = new THREE.Vector3(leanX * 0.85, totalH * frac, leanZ * 0.65);
                            const ang = b * 1.28 + r() * 0.35;
                            const bLen = (0.72 + r() * 0.28) * hScale;
                            const mid = new THREE.Vector3(
                                orig.x + Math.cos(ang) * bLen * 0.55,
                                orig.y + 0.10 * hScale,
                                orig.z + Math.sin(ang) * bLen * 0.55
                            );
                            const tip = new THREE.Vector3(
                                orig.x + Math.cos(ang) * bLen,
                                orig.y + 0.22 * hScale,
                                orig.z + Math.sin(ang) * bLen
                            );
                            trunkGrp.add(new THREE.Mesh(createCurvedTrunkGeo([orig, mid, tip], [0.065 * hScale, 0.04 * hScale, 0.02], 5, true), barkMat));
                            boughTips.push(tip);
                        }

                        if (showFoliage) {
                            const topPad = new THREE.Mesh(createFoliageBlobGeo(1.08 * hScale * cScale, 0.34 * hScale, 1.08 * hScale * cScale, 1, t.seed + 19), folMat);
                            topPad.position.set(leanX, totalH * 0.98, leanZ);
                            canopyGrp.add(topPad);

                            boughTips.forEach(function (tip, idx) {
                                const pad = new THREE.Mesh(createFoliageBlobGeo(0.68 * hScale * cScale, 0.26 * hScale, 0.68 * hScale * cScale, 1, t.seed + idx * 7), folMat);
                                pad.position.set(tip.x, tip.y + 0.08 * hScale, tip.z);
                                canopyGrp.add(pad);
                            });
                        }

                        if (env === 'c') addCultistVines(corruptGrp, baseR, totalH * 0.72, t.seed + 77);
                        return root;
                    }

                    // 3/9 Ель (sp === 2): Full conical conifer skirt hiding trunk from 14% height to pointed tip
                    if (sp === 2) {
                        const totalH = 4.2 * hScale;
                        const baseR = 0.21 * hScale;
                        const spine = [
                            new THREE.Vector3(0, 0, 0),
                            new THREE.Vector3(0.03, totalH * 0.5, -0.02),
                            new THREE.Vector3(0, totalH, 0)
                        ];
                        trunkGrp.add(new THREE.Mesh(createCurvedTrunkGeo(spine, [baseR, baseR * 0.45, 0.02], 7, true), barkMat));

                        if (showFoliage) {
                            const tiers = 7;
                            for (let tr = 0; tr < tiers; tr++) {
                                const ft = tr / (tiers - 1);
                                const yPos = totalH * (0.18 + ft * 0.78);
                                const rad = (1.32 - ft * 1.04) * hScale * cScale;
                                const tierH = (0.72 - ft * 0.24) * hScale;
                                const tierMesh = new THREE.Mesh(createSpruceTierGeo(rad, tierH, t.seed + tr * 11), folMat);
                                tierMesh.position.set(0, yPos, 0);
                                tierMesh.rotation.y = tr * 0.52;
                                canopyGrp.add(tierMesh);
                            }
                        }

                        if (env === 'c') addCultistVines(corruptGrp, baseR, totalH * 0.55, t.seed + 77);
                        return root;
                    }

                    // Deciduous & Special Upright Trees: 0=Birch, 3=Oak, 4=Snag, 5=Aspen, 6=Willow, 8=Sap Tree
                    const totalH = (sp === 3 ? 3.5 : (sp === 6 ? 3.3 : 3.9)) * hScale;
                    const baseR = (sp === 3 ? 0.30 : (sp === 6 ? 0.26 : 0.21)) * hScale;
                    const topR = (sp === 4 ? 0.045 : 0.065) * hScale;

                    const leanX = (sp === 8 ? 0.36 : (r() - 0.5) * 0.26) * hScale;
                    const leanZ = (r() - 0.5) * 0.22 * hScale;
                    const spine = [
                        new THREE.Vector3(0, 0, 0),
                        new THREE.Vector3(leanX * 0.25, totalH * 0.34, leanZ * 0.25),
                        new THREE.Vector3(leanX * 0.65, totalH * 0.68, leanZ * 0.65),
                        new THREE.Vector3(leanX, totalH * 0.94, leanZ)
                    ];
                    const rads = [baseR, baseR * 0.74, baseR * 0.48, topR];
                    trunkGrp.add(new THREE.Mesh(createCurvedTrunkGeo(spine, rads, 8, true), barkMat));

                    // Buttress roots at Y = 0
                    for (let rt = 0; rt < 4; rt++) {
                        const ang = (rt / 4) * Math.PI * 2 + r() * 0.4;
                        const rPts = [
                            new THREE.Vector3(Math.cos(ang) * baseR * 0.5, 0.35 * hScale, Math.sin(ang) * baseR * 0.5),
                            new THREE.Vector3(Math.cos(ang) * baseR * 1.45, 0.10, Math.sin(ang) * baseR * 1.45),
                            new THREE.Vector3(Math.cos(ang) * baseR * 2.05, 0.0, Math.sin(ang) * baseR * 2.05)
                        ];
                        trunkGrp.add(new THREE.Mesh(createCurvedTrunkGeo(rPts, [baseR * 0.38, baseR * 0.22, 0.02], 5, true), barkMat));
                    }

                    // Branches
                    const branchCount = (sp === 4 || sp === 8) ? 6 : 5;
                    const branchMids = [];
                    const branchTips = [];
                    for (let b = 0; b < branchCount; b++) {
                        const frac = 0.50 + (b / branchCount) * 0.38;
                        const origin = new THREE.Vector3().lerpVectors(spine[1], spine[3], (frac - 0.34) / 0.60);
                        const ang = b * 2.35 + r() * 0.45;
                        const bLen = (0.72 + r() * 0.38) * hScale * (1.12 - frac * 0.40);
                        const tip = new THREE.Vector3(
                            origin.x + Math.cos(ang) * bLen,
                            origin.y + (sp === 6 ? 0.16 : 0.32) * hScale,
                            origin.z + Math.sin(ang) * bLen
                        );
                        const mid = origin.clone().lerp(tip, 0.52);
                        mid.y += 0.08 * hScale;
                        trunkGrp.add(new THREE.Mesh(createCurvedTrunkGeo([origin, mid, tip], [baseR * 0.30, baseR * 0.17, 0.025], 5, true), barkMat));
                        branchMids.push(mid);
                        branchTips.push(tip);
                    }

                    if (showFoliage) {
                        if (sp === 6) {
                            // 7/9 Плакучая ива: broad upper dome + continuous tapered volumetric drooping curtains
                            const dome = new THREE.Mesh(createFoliageBlobGeo(1.25 * hScale * cScale, 0.65 * hScale, 1.25 * hScale * cScale, 1, t.seed + 21), folMat);
                            dome.position.set(leanX, totalH * 0.92, leanZ);
                            canopyGrp.add(dome);

                            branchTips.forEach(function (tip, idx) {
                                const shoulder = new THREE.Mesh(createFoliageBlobGeo(0.55 * hScale * cScale, 0.42 * hScale, 0.55 * hScale * cScale, 1, t.seed + idx * 5), folMat);
                                shoulder.position.copy(tip);
                                canopyGrp.add(shoulder);

                                const dropLen = (1.15 + (idx % 2) * 0.28) * hScale * cScale;
                                const curtain = new THREE.Mesh(createWillowCurtainGeo(0.28 * hScale * cScale, 0.08 * hScale, dropLen, t.seed + idx * 9), folMat);
                                curtain.position.set(tip.x * 1.05, tip.y - 0.05 * hScale, tip.z * 1.05);
                                canopyGrp.add(curtain);
                            });
                        } else {
                            // Cohesive overlapping multi-lobed canopy (central core + crown + mid-branch lobes)
                            const coreBlob = new THREE.Mesh(
                                createFoliageBlobGeo(1.02 * hScale * cScale, 0.88 * hScale * cScale, 1.02 * hScale * cScale, 1, t.seed + 2),
                                folMat
                            );
                            coreBlob.position.set(leanX * 0.85, totalH * 0.84, leanZ * 0.85);

                            const crownBlob = new THREE.Mesh(
                                createFoliageBlobGeo(0.84 * hScale * cScale, 0.68 * hScale * cScale, 0.84 * hScale * cScale, 1, t.seed + 5),
                                folMat
                            );
                            crownBlob.position.set(leanX, totalH * 1.02, leanZ);
                            canopyGrp.add(coreBlob, crownBlob);

                            branchMids.forEach(function (mid, idx) {
                                const lobe = new THREE.Mesh(
                                    createFoliageBlobGeo(0.68 * hScale * cScale, 0.56 * hScale * cScale, 0.68 * hScale * cScale, 1, t.seed + idx * 9 + 1),
                                    folMat
                                );
                                lobe.position.set(mid.x, mid.y + 0.08 * hScale, mid.z);
                                canopyGrp.add(lobe);
                            });
                        }
                    }

                    // Black Sap Tree (sp === 8) or Cultist state
                    if (sp === 8 || env === 'c') {
                        addCultistVines(corruptGrp, baseR, totalH * 0.78, t.seed + 77);
                        const nodeMat = makeMat({ color: 0x991822, emissive: 0x6b0d14, emissiveIntensity: 0.85, roughness: 0.4 });
                        for (let n = 0; n < 3; n++) {
                            const node = new THREE.Mesh(createFoliageBlobGeo(0.11, 0.14, 0.11, 0, n + t.seed), nodeMat);
                            const f = 0.25 + n * 0.24;
                            node.position.set(leanX * f + (n % 2 ? 0.12 : -0.12), totalH * f, leanZ * f);
                            corruptGrp.add(node);
                            pulsingSapMeshes.push(node);
                        }
                    }

                    return root;
                }

                /* ---------------------------------------------------------
                   5.6 CATEGORY 2: BUSHES & UNDERGROWTH (Bush_Root, 5 DISTINCT TYPES)
                   --------------------------------------------------------- */
                function buildSingleBushCluster(sp, density, env, seed) {
                    const r = prng(seed);
                    const grp = new THREE.Group();
                    const dMult = [1.0, 0.76, 0.54][density];

                    let folTex = TEX.foliageGreen;
                    if (sp === 2) folTex = TEX.fernGreen;
                    else if (sp === 3) folTex = TEX.willowLeaf;
                    else if (sp === 4) folTex = TEX.foliageAutumn;

                    const folColor = env === 'd' ? 0x3b2c22 : (env === 'c' ? 0x632a32 : 0xffffff);
                    const folMat = makeMat({ map: folTex, color: folColor });
                    const stemMat = makeMat({ map: env === 'd' ? TEX.charredWood : TEX.oak });

                    if (sp === 0) {
                        // 1/5 Орешник: Wide multi-stemmed woodland hazel shrub with layered horizontal leaf fans & hanging catkins
                        const stemCount = Math.max(4, Math.round(7 * dMult));
                        const catkinMat = makeMat({ color: 0x9c8b46, roughness: 0.85 });
                        for (let i = 0; i < stemCount; i++) {
                            const ang = (i / stemCount) * Math.PI * 2 + r() * 0.35;
                            const h = (0.72 + r() * 0.32) * (0.9 + dMult * 0.12);
                            const spread = (0.48 + r() * 0.24) * (0.85 + dMult * 0.18);
                            const mid = new THREE.Vector3(Math.cos(ang) * spread * 0.45, h * 0.58, Math.sin(ang) * spread * 0.45);
                            const tip = new THREE.Vector3(Math.cos(ang) * spread, h, Math.sin(ang) * spread);
                            grp.add(new THREE.Mesh(createCurvedTrunkGeo([new THREE.Vector3(0, 0, 0), mid, tip], [0.024, 0.015, 0.006], 5, true), stemMat));

                            const pad = new THREE.Mesh(
                                createFoliageBlobGeo(0.34 * dMult + 0.12, 0.14 * dMult + 0.05, 0.34 * dMult + 0.12, 1, seed + i * 5),
                                folMat
                            );
                            pad.position.copy(tip);
                            grp.add(pad);

                            if (env !== 'd' && i % 2 === 0) {
                                const catkin = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.005, 0.11, 4), catkinMat);
                                catkin.position.set(tip.x, tip.y - 0.10, tip.z);
                                grp.add(catkin);
                            }
                        }
                        return grp;
                    }

                    if (sp === 1) {
                        // 2/5 Шиповник: Tangled thorny arching canes with dark-green leaves & bright scarlet rosehips
                        const caneCount = Math.max(5, Math.round(9 * dMult));
                        const berryMat = makeMat({ color: 0xc9221c, emissive: 0x3b0806, emissiveIntensity: 0.25, roughness: 0.35 });
                        const darkLeafMat = makeMat({ map: TEX.needles, color: folColor });
                        for (let i = 0; i < caneCount; i++) {
                            const ang = (i / caneCount) * Math.PI * 2 + r() * 0.4;
                            const h = 0.52 + r() * 0.30;
                            const spread = 0.42 + r() * 0.28;
                            const mid = new THREE.Vector3(Math.cos(ang) * spread * 0.55, h * 0.95, Math.sin(ang) * spread * 0.55);
                            const tip = new THREE.Vector3(Math.cos(ang) * spread, h * 0.48, Math.sin(ang) * spread);
                            grp.add(new THREE.Mesh(createCurvedTrunkGeo([new THREE.Vector3(0, 0, 0), mid, tip], [0.016, 0.011, 0.004], 5, true), stemMat));

                            const spray = new THREE.Mesh(createFoliageBlobGeo(0.18 * dMult + 0.06, 0.14 * dMult + 0.05, 0.18 * dMult + 0.06, 0, seed + i * 7), darkLeafMat);
                            spray.position.copy(mid);
                            grp.add(spray);

                            if (env !== 'd') {
                                for (let b = 0; b < 3; b++) {
                                    const berry = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.018, 0.036, 5), berryMat);
                                    berry.position.set(
                                        mid.x + (r() - 0.5) * 0.22,
                                        mid.y + (r() - 0.5) * 0.14,
                                        mid.z + (r() - 0.5) * 0.22
                                    );
                                    grp.add(berry);
                                }
                            }
                        }
                        return grp;
                    }

                    if (sp === 2) {
                        // 3/5 Папоротник: Explicit double-sided arched fronds + 3D central rachis stems
                        const frondMat = makeMat({ map: TEX.fernGreen, color: folColor, doubleSide: true });
                        const frondCount = Math.max(5, Math.round(10 * dMult));
                        for (let i = 0; i < frondCount; i++) {
                            const ang = (i / frondCount) * Math.PI * 2 + (r() - 0.5) * 0.25;
                            const len = (0.58 + r() * 0.26) * (0.85 + dMult * 0.18);
                            const arch = 0.24 + r() * 0.12;
                            const fHolder = new THREE.Group();
                            fHolder.rotation.y = ang;
                            fHolder.rotation.x = 0.12 + (i % 2) * 0.14;

                            const rachisPts = [
                                new THREE.Vector3(0, 0.02, 0),
                                new THREE.Vector3(0, arch * 0.85, -len * 0.5),
                                new THREE.Vector3(0, arch * 0.45, -len)
                            ];
                            const rachis = new THREE.Mesh(createCurvedTrunkGeo(rachisPts, [0.012, 0.008, 0.003], 5, true), stemMat);
                            const blade = new THREE.Mesh(createSolidFernFrondGeo(len, 0.24, arch), frondMat);
                            fHolder.add(rachis, blade);
                            grp.add(fHolder);
                        }
                        return grp;
                    }

                    if (sp === 3) {
                        // 4/5 Камыш и осока with brown cattail spikes
                        const stalkCount = Math.max(8, Math.round(18 * dMult));
                        const cattailMat = makeMat({ color: env === 'd' ? 0x1f1b19 : 0x4a2c18, roughness: 0.94 });
                        for (let i = 0; i < stalkCount; i++) {
                            const ox = (r() - 0.5) * 0.48;
                            const oz = (r() - 0.5) * 0.48;
                            const h = 0.72 + r() * 0.48;
                            const leanX = ox * 0.45 + (r() - 0.5) * 0.16;
                            const leanZ = oz * 0.45 + (r() - 0.5) * 0.16;
                            const pts = [
                                new THREE.Vector3(ox, 0, oz),
                                new THREE.Vector3(ox + leanX * 0.5, h * 0.55, oz + leanZ * 0.5),
                                new THREE.Vector3(ox + leanX, h, oz + leanZ)
                            ];
                            grp.add(new THREE.Mesh(createCurvedTrunkGeo(pts, [0.015, 0.010, 0.004], 5, true), folMat));

                            if (i % 3 === 0) {
                                const head = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.14, 6), cattailMat);
                                head.position.set(ox + leanX * 0.85, h * 0.84, oz + leanZ * 0.85);
                                grp.add(head);
                            }
                        }
                        return grp;
                    }

                    // 5/5 Бурьян / Репейник: Broad basal rosette leaves, tall weed stalks & purple burdock flower heads
                    const weedMat = makeMat({ map: TEX.foliageGreen, color: env === 'd' ? 0x3b2c22 : 0x6c7a44 });
                    const flowerMat = makeMat({ color: 0x8f3478, roughness: 0.65 });
                    for (let b = 0; b < 6; b++) {
                        const ang = (b / 6) * Math.PI * 2 + r() * 0.3;
                        const leaf = new THREE.Mesh(createFoliageBlobGeo(0.24, 0.04, 0.15, 0, seed + b), weedMat);
                        leaf.position.set(Math.cos(ang) * 0.24, 0.09, Math.sin(ang) * 0.24);
                        leaf.rotation.set(0.25, -ang, 0);
                        grp.add(leaf);
                    }
                    const stalkCnt = Math.max(3, Math.round(5 * dMult));
                    for (let s = 0; s < stalkCnt; s++) {
                        const ang = (s / stalkCnt) * Math.PI * 2 + r() * 0.5;
                        const dist = 0.06 + r() * 0.14;
                        const h = 0.78 + r() * 0.42;
                        const top = new THREE.Vector3(Math.cos(ang) * (dist + 0.08), h, Math.sin(ang) * (dist + 0.08));
                        grp.add(new THREE.Mesh(createCurvedTrunkGeo([
                            new THREE.Vector3(Math.cos(ang) * dist, 0, Math.sin(ang) * dist),
                            top
                        ], [0.016, 0.008], 5, true), weedMat));

                        if (env !== 'd') {
                            const bur = new THREE.Mesh(new THREE.OctahedronGeometry(0.036, 0), flowerMat);
                            bur.position.copy(top);
                            grp.add(bur);
                        }
                    }
                    return grp;
                }

                function buildBush() {
                    const b = state.bush;
                    const env = state.envState;
                    const r = prng(b.seed * 41 + b.species * 7 + 3);
                    const root = new THREE.Group();
                    root.name = 'Bush_Root';

                    const count = [1, 3, 6][b.group];
                    for (let i = 0; i < count; i++) {
                        const cl = buildSingleBushCluster(b.species, b.density, env, b.seed + i * 19);
                        if (i > 0) {
                            const ang = (i / (count - 1)) * Math.PI * 2 + r() * 0.5;
                            const dist = (b.group === 1 ? 0.58 : 0.78) + r() * 0.35;
                            cl.position.set(Math.cos(ang) * dist, 0, Math.sin(ang) * dist);
                            const sc = 0.75 + r() * 0.35;
                            cl.scale.set(sc, sc, sc);
                        }
                        root.add(cl);
                    }

                    if (env === 'c') addCultistVines(root, 0.28, 0.65, b.seed + 91);
                    return root;
                }

                /* ---------------------------------------------------------
                   5.7 CATEGORY 3: ROCKS & STUMPS (RockStump_Root, 8 DISTINCT TYPES)
                   --------------------------------------------------------- */
                function buildRockStump() {
                    const rk = state.rock;
                    const env = state.envState;
                    const r = prng(rk.seed * 53 + rk.species * 13 + 9);
                    const root = new THREE.Group();
                    root.name = 'RockStump_Root';

                    const sz = [0.74, 1.0, 1.36][rk.size];
                    const sp = rk.species;

                    const stoneTex = rk.moss === 0 ? TEX.granite : TEX.mossStone;
                    const stoneMat = makeMat({
                        map: stoneTex,
                        color: env === 'd' ? 0x5c5856 : (env === 'c' ? 0x6e6268 : 0xffffff),
                        roughness: rk.moss === 2 ? 0.42 : 0.88
                    });

                    const barkTex = env === 'd' ? TEX.charredWood : (env === 'c' ? TEX.sapWood : TEX.oak);
                    const barkMat = makeMat({ map: barkTex });

                    if (sp === 0) {
                        // 1/8 Лесной валун: Faceted angular glacial boulder + wedge stone + mossy cap
                        const main = new THREE.Mesh(createFoliageBlobGeo(0.66 * sz, 0.46 * sz, 0.54 * sz, 0, rk.seed + 11), stoneMat);
                        main.position.set(0, 0.28 * sz, 0);
                        main.rotation.set(0.12, r() * Math.PI * 2, -0.08);
                        const wedge = new THREE.Mesh(createFoliageBlobGeo(0.32 * sz, 0.22 * sz, 0.28 * sz, 0, rk.seed + 22), stoneMat);
                        wedge.position.set(0.42 * sz, 0.14 * sz, 0.22 * sz);
                        root.add(main, wedge);
                        if (rk.moss > 0 && env !== 'd') {
                            const mossCap = new THREE.Mesh(createFoliageBlobGeo(0.42 * sz, 0.08 * sz, 0.34 * sz, 1, rk.seed + 33), makeMat({ map: TEX.fernGreen }));
                            mossCap.position.set(-0.04 * sz, 0.56 * sz, 0.02 * sz);
                            root.add(mossCap);
                        }
                    } else if (sp === 1) {
                        // 2/8 Группа камней: Asymmetric cairn pile with flat base slab & 4 stacked stones
                        const slab = new THREE.Mesh(new THREE.CylinderGeometry(0.68 * sz, 0.78 * sz, 0.14 * sz, 7), stoneMat);
                        slab.position.y = 0.07 * sz;
                        root.add(slab);
                        const offsets = [[-0.22, 0.26, -0.14, 0.34], [0.24, 0.22, 0.12, 0.28], [0.02, 0.48, -0.04, 0.24], [-0.08, 0.18, 0.32, 0.22]];
                        offsets.forEach(function (o, idx) {
                            const st = new THREE.Mesh(createFoliageBlobGeo(o[3] * sz, o[3] * 0.78 * sz, o[3] * 0.9 * sz, 0, rk.seed + idx * 9), stoneMat);
                            st.position.set(o[0] * sz, o[1] * sz, o[2] * sz);
                            st.rotation.set(r() * 0.4, r() * 3.1, r() * 0.4);
                            root.add(st);
                        });
                    } else if (sp === 2) {
                        // 3/8 Скальный выступ: Slanted stratified cliff crag with 4 stepped rock ledges
                        for (let tier = 0; tier < 4; tier++) {
                            const w = (1.15 - tier * 0.22) * sz;
                            const d = (0.78 - tier * 0.14) * sz;
                            const h = (0.28 - tier * 0.02) * sz;
                            const ledge = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), stoneMat);
                            ledge.position.set((-0.14 + tier * 0.09) * sz, (0.14 + tier * 0.23) * sz, (-0.08 + tier * 0.05) * sz);
                            ledge.rotation.set(0.06, 0.18 + tier * 0.08, -0.14);
                            root.add(ledge);
                        }
                    } else if (sp === 3) {
                        // 4/8 Болотный камень: Wide flat-topped wet stone half-submerged in dark peat mud with creeping roots
                        const mudPad = new THREE.Mesh(new THREE.CylinderGeometry(0.88 * sz, 0.96 * sz, 0.06 * sz, 10), makeMat({ map: TEX.swampWater, roughness: 0.25 }));
                        mudPad.position.y = 0.03 * sz;
                        const bogStone = new THREE.Mesh(new THREE.CylinderGeometry(0.56 * sz, 0.68 * sz, 0.32 * sz, 8), stoneMat);
                        bogStone.position.y = 0.18 * sz;
                        root.add(mudPad, bogStone);
                        addCultistVines(root, 0.56 * sz, 0.38 * sz, rk.seed + 61);
                    } else if (sp === 4) {
                        // 5/8 Рунический камень: Bevelled stone menhir prism with flush glowing rune tablet
                        const menhirH = 1.48 * sz;
                        const menhir = new THREE.Mesh(new THREE.BoxGeometry(0.56 * sz, menhirH, 0.40 * sz), stoneMat);
                        menhir.position.y = menhirH * 0.5;
                        const cap = new THREE.Mesh(new THREE.ConeGeometry(0.36 * sz, 0.28 * sz, 4), stoneMat);
                        cap.position.y = menhirH + 0.14 * sz;
                        cap.rotation.y = Math.PI * 0.25;

                        const frameMat = makeMat({ color: 0x1e2226, roughness: 0.9 });
                        const frame = new THREE.Mesh(new THREE.BoxGeometry(0.36 * sz, 0.68 * sz, 0.025), frameMat);
                        frame.position.set(0, menhirH * 0.54, 0.208 * sz);

                        const rv = getRuneVisual(rk.runeSym, rk.runeCol);
                        const runeMat = makeMat({
                            map: rv.tex,
                            color: rv.hex,
                            emissive: rv.hex,
                            emissiveIntensity: 1.65,
                            roughness: 0.22
                        });
                        const tablet = new THREE.Mesh(new THREE.BoxGeometry(0.30 * sz, 0.60 * sz, 0.02), runeMat);
                        tablet.position.set(0, menhirH * 0.54, 0.222 * sz);
                        pulsingRuneMeshes.push(tablet);

                        root.add(menhir, cap, frame, tablet);
                        if (env === 'c') addCultistVines(root, 0.36 * sz, 0.85 * sz, rk.seed + 61);
                    } else if (sp === 5) {
                        // 6/8 Пень с опятами
                        const h = 0.68 * sz;
                        const pts = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.03, h * 0.5, 0), new THREE.Vector3(0.01, h, 0.02)];
                        const stump = new THREE.Mesh(createCurvedTrunkGeo(pts, [0.34 * sz, 0.25 * sz, 0.23 * sz], 9, true), barkMat);
                        root.add(stump);

                        const capMat = makeMat({ color: 0xb8843b, roughness: 0.7 });
                        const stemM = makeMat({ color: 0xd9ceb8, roughness: 0.85 });
                        for (let m = 0; m < 7; m++) {
                            const ang = (m / 7) * Math.PI * 2 + r() * 0.3;
                            const dist = (0.28 + r() * 0.14) * sz;
                            const mh = (0.10 + r() * 0.08) * sz;
                            const mStem = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.016, mh, 5), stemM);
                            mStem.position.set(Math.cos(ang) * dist, mh / 2, Math.sin(ang) * dist);
                            const mCap = new THREE.Mesh(new THREE.ConeGeometry(0.045 * sz, 0.035 * sz, 6), capMat);
                            mCap.position.set(Math.cos(ang) * dist, mh + 0.01, Math.sin(ang) * dist);
                            root.add(mStem, mCap);
                        }
                    } else if (sp === 6) {
                        // 7/8 Поваленный ствол
                        const len = 2.4 * sz;
                        const pts = [
                            new THREE.Vector3(-len * 0.5, 0.19 * sz, 0),
                            new THREE.Vector3(0, 0.17 * sz, 0.08),
                            new THREE.Vector3(len * 0.5, 0.15 * sz, -0.05)
                        ];
                        root.add(new THREE.Mesh(createCurvedTrunkGeo(pts, [0.22 * sz, 0.19 * sz, 0.16 * sz], 8, true), barkMat));
                        if (rk.moss > 0) {
                            const mossPatch = new THREE.Mesh(createFoliageBlobGeo(0.45 * sz, 0.08 * sz, 0.18 * sz, 1, rk.seed + 4), makeMat({ map: TEX.fernGreen }));
                            mossPatch.position.set(0, 0.32 * sz, 0.04);
                            root.add(mossPatch);
                        }
                    } else {
                        // 8/8 Трухлявый пень (Hollow Rotten Stump)
                        const h = 0.84 * sz;
                        const hollow = createHollowStumpGeo(0.36 * sz, 0.28 * sz, h, rk.seed + 15);
                        const stumpMesh = new THREE.Mesh(hollow.geo, barkMat);
                        root.add(stumpMesh);

                        const shelfMat = makeMat({ color: 0xc9b48c, roughness: 0.78 });
                        for (let f = 0; f < 5; f++) {
                            const ang = (f / 5) * Math.PI * 2 + r() * 0.4;
                            const yNorm = 0.25 + (f / 5) * 0.52;
                            const outerR = hollow.getOuterRadiusAt(yNorm, ang);
                            const shelf = new THREE.Mesh(new THREE.CylinderGeometry(0.11 * sz, 0.04 * sz, 0.03 * sz, 7), shelfMat);
                            shelf.position.set(Math.cos(ang) * (outerR + 0.03 * sz), yNorm * h, Math.sin(ang) * (outerR + 0.03 * sz));
                            shelf.rotation.y = -ang;
                            root.add(shelf);
                        }
                    }

                    if (env === 'c' && sp >= 5) addCultistVines(root, 0.35 * sz, 0.75 * sz, rk.seed + 95);
                    return root;
                }

                /* ---------------------------------------------------------
                   5.8 CATEGORY 4: MODULAR 4.0m x 4.0m WATER & SWAMP TILES
                   --------------------------------------------------------- */
                function buildWaterTile() {
                    const w = state.water;
                    const env = state.envState;
                    const r = prng(w.seed * 61 + w.tile * 19 + 7);
                    const root = new THREE.Group();
                    root.name = 'WaterTile_Root';

                    const tileGroup = new THREE.Group();
                    tileGroup.name = 'Tile_Content';
                    tileGroup.rotation.y = w.rot * (Math.PI / 2);
                    root.add(tileGroup);

                    const tIdx = w.tile;
                    const isSwamp = (tIdx <= 3);
                    const waterY = 0.04;
                    const bankH = [0.09, 0.14, 0.20][w.depth];

                    const bankMat = makeMat({
                        map: env === 'd' ? TEX.charredWood : (isSwamp ? TEX.forestFloor : TEX.mossStone),
                        color: envTint()
                    });
                    const waterTex = env === 'c' ? TEX.sapWood : (isSwamp ? TEX.swampWater : TEX.riverWater);
                    const waterMat = makeMat({
                        map: waterTex,
                        color: env === 'c' ? 0x992632 : 0xffffff,
                        roughness: 0.24,
                        metalness: 0.18
                    });
                    const plankMat = makeMat({ map: env === 'd' ? TEX.charredWood : TEX.planks });
                    const reedMat = makeMat({ map: TEX.willowLeaf, color: env === 'd' ? 0x3b2c22 : 0xffffff });

                    function addWaterSlab(x, z, sx, sz) {
                        const m = new THREE.Mesh(new THREE.BoxGeometry(sx, 0.04, sz), waterMat);
                        m.name = 'WaterSurface';
                        m.position.set(x, waterY - 0.02, z);
                        tileGroup.add(m);
                    }

                    function addBankBlock(x, z, sx, sz) {
                        const m = new THREE.Mesh(new THREE.BoxGeometry(sx, bankH, sz), bankMat);
                        m.position.set(x, bankH / 2, z);
                        tileGroup.add(m);
                    }

                    function addReedsAt(x, z, count) {
                        for (let i = 0; i < count; i++) {
                            const ox = x + (r() - 0.5) * 0.45;
                            const oz = z + (r() - 0.5) * 0.45;
                            const h = 0.45 + r() * 0.35;
                            const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.014, h, 4), reedMat);
                            stalk.position.set(ox, h / 2, oz);
                            stalk.rotation.z = (r() - 0.5) * 0.25;
                            tileGroup.add(stalk);
                        }
                    }

                    if (tIdx === 0) {
                        addWaterSlab(0, 0, 4.0, 4.0);
                        for (let h = 0; h < 4; h++) {
                            const hx = (r() - 0.5) * 2.5;
                            const hz = (r() - 0.5) * 2.5;
                            const hummock = new THREE.Mesh(createFoliageBlobGeo(0.45, 0.13, 0.42, 1, w.seed + h), bankMat);
                            hummock.position.set(hx, 0.05, hz);
                            tileGroup.add(hummock);
                            addReedsAt(hx, hz, 4);
                        }
                    } else if (tIdx === 1) {
                        addBankBlock(0, -1.0, 4.0, 2.0);
                        addWaterSlab(0, 1.0, 4.0, 2.0);
                        addReedsAt(-1.1, 0.15, 5);
                        addReedsAt(1.0, 0.20, 5);
                    } else if (tIdx === 2) {
                        addWaterSlab(0, 0, 4.0, 4.0);
                        addBankBlock(-1.0, -1.0, 2.0, 2.0);
                        addReedsAt(-0.1, -0.8, 4);
                        addReedsAt(-0.8, -0.1, 4);
                    } else if (tIdx === 3) {
                        addWaterSlab(0, 0, 4.0, 4.0);
                        [-0.36, 0.36].forEach(function (rx) {
                            const runner = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.08, 4.0), plankMat);
                            runner.position.set(rx, 0.08, 0);
                            tileGroup.add(runner);
                        });
                        for (let i = 0; i < 16; i++) {
                            const z = -1.875 + i * 0.25;
                            const plank = new THREE.Mesh(new THREE.BoxGeometry(1.12, 0.05, 0.19), plankMat);
                            plank.position.set((r() - 0.5) * 0.05, 0.14, z);
                            plank.rotation.y = (r() - 0.5) * 0.08;
                            tileGroup.add(plank);
                        }
                        addReedsAt(-1.35, -0.8, 5);
                        addReedsAt(1.35, 0.9, 5);
                    } else if (tIdx === 4) {
                        addBankBlock(-1.5, 0, 1.0, 4.0);
                        addBankBlock( 1.5, 0, 1.0, 4.0);
                        addWaterSlab(0, 0, 2.0, 4.0);
                        addReedsAt(-0.95, -1.0, 4);
                        addReedsAt( 0.95,  0.8, 4);
                    } else if (tIdx === 5) {
                        addWaterSlab(0, 0, 4.0, 4.0);
                        addBankBlock(-1.5, 0, 1.0, 4.0);
                        addBankBlock(0.5, -1.5, 3.0, 1.0);
                        addBankBlock(1.5, 1.5, 1.0, 1.0);
                        addReedsAt(-0.9, 0.6, 4);
                    } else if (tIdx === 6) {
                        addWaterSlab(0, 0, 4.0, 4.0);
                        addBankBlock(-1.5, 0, 1.0, 4.0);
                        addBankBlock(1.5, -1.5, 1.0, 1.0);
                        addBankBlock(1.5,  1.5, 1.0, 1.0);
                        addReedsAt(-0.95, 0, 4);
                    } else if (tIdx === 7) {
                        addBankBlock(-1.5, 0, 1.0, 4.0);
                        addBankBlock( 1.5, 0, 1.0, 4.0);
                        addWaterSlab(0, 0, 2.0, 4.0);
                        for (let s = -2; s <= 2; s++) {
                            const st = new THREE.Mesh(createFoliageBlobGeo(0.24, 0.08, 0.22, 0, w.seed + s), makeMat({ map: TEX.granite }));
                            st.position.set(s * 0.36, 0.04, 0.38);
                            tileGroup.add(st);
                        }
                        const bridge = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.06, 0.72), plankMat);
                        bridge.position.set(0, bankH + 0.03, -0.35);
                        tileGroup.add(bridge);
                    } else if (tIdx === 8) {
                        addWaterSlab(0, 0, 4.0, 4.0);
                    } else if (tIdx === 9) {
                        addBankBlock(0, -1.25, 4.0, 1.5);
                        addWaterSlab(0, 0.75, 4.0, 2.5);
                        addReedsAt(-1.2, -0.45, 4);
                        addReedsAt( 1.1, -0.45, 4);
                    } else {
                        addWaterSlab(0, 0, 4.0, 4.0);
                        addBankBlock(0, -1.5, 4.0, 1.0);
                        addBankBlock(-1.5, 0.5, 1.0, 3.0);
                        addReedsAt(-0.9, -0.9, 5);
                    }

                    if (env === 'c') addCultistVines(tileGroup, 0.35, 0.65, w.seed + 44);
                    return root;
                }

                /* ---------------------------------------------------------
                   5.9 CATEGORY 5: MYSTICAL SHRINES & LIFECYCLE CLIPS
                   --------------------------------------------------------- */
                let flickerCandles = [];

                function buildMysticShrine() {
                    const m = state.mystic;
                    const env = state.envState;
                    const r = prng(m.seed * 67 + m.shrine * 23 + 11);

                    // Unified Godot 4 Hierarchy for all 5 Shrines
                    const root = new THREE.Group();
                    root.name = 'Mystic_Root';

                    const baseGrp = new THREE.Group(); baseGrp.name = 'Shrine_Base';
                    const breakL = new THREE.Group(); breakL.name = 'Breakable_Left';
                    const breakR = new THREE.Group(); breakR.name = 'Breakable_Right';
                    const coreGrp = new THREE.Group(); coreGrp.name = 'Center_Altar_Core';
                    const relicPivot = new THREE.Group(); relicPivot.name = 'Relic_Pivot';
                    const swingGrp = new THREE.Group(); swingGrp.name = 'Swinging_Details';
                    const glowRig = new THREE.Group(); glowRig.name = 'Active_Glow_Rig';
                    const debrisGrp = new THREE.Group(); debrisGrp.name = 'Debris_Cluster';

                    root.add(baseGrp, breakL, breakR, coreGrp, relicPivot, swingGrp, glowRig, debrisGrp);

                    const sp = m.shrine;
                    const stoneMat = makeMat({
                        map: TEX.mossStone,
                        color: env === 'd' ? 0x5c5856 : (env === 'c' ? 0x736369 : 0xffffff)
                    });
                    const darkWoodMat = makeMat({ map: env === 'd' ? TEX.charredWood : TEX.oak });

                    const rv = getRuneVisual(m.runeSym, m.runeCol);
                    const glowMat = makeMat({
                        map: rv.tex,
                        color: rv.hex,
                        emissive: rv.hex,
                        emissiveIntensity: 1.55,
                        roughness: 0.25
                    });
                    const flameMat = makeMat({ color: 0xffc857, emissive: 0xff8c1a, emissiveIntensity: 1.6 });
                    const waxMat = makeMat({ color: 0xd9d2be, roughness: 0.7 });

                    function addCandleCluster(parent, x, y, z) {
                        for (let c = 0; c < 3; c++) {
                            const ch = 0.08 + c * 0.035;
                            const ox = x + (c - 1) * 0.035;
                            const oz = z + (c % 2) * 0.025;
                            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.018, ch, 6), waxMat);
                            body.position.set(ox, y + ch / 2, oz);
                            parent.add(body);

                            const flame = new THREE.Mesh(new THREE.ConeGeometry(0.012, 0.032, 5), flameMat);
                            flame.position.set(ox, y + ch + 0.018, oz);
                            glowRig.add(flame);
                            flickerCandles.push(flame);
                        }
                    }

                    function addOfferingBowl(parent, x, y, z) {
                        const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.09, 0.08, 7), stoneMat);
                        bowl.position.set(x, y + 0.04, z);
                        const herbs = new THREE.Mesh(createFoliageBlobGeo(0.10, 0.04, 0.10, 0, m.seed + Math.round(x * 10)), makeMat({ map: TEX.fernGreen }));
                        herbs.position.set(x, y + 0.08, z);
                        parent.add(bowl, herbs);
                    }

                    // Build Debris Cluster (hidden in Inactive/Active, revealed during Destroy)
                    for (let d = 0; d < 8; d++) {
                        const ang = (d / 8) * Math.PI * 2 + r() * 0.4;
                        const dist = 0.55 + r() * 0.85;
                        const chunk = new THREE.Mesh(createFoliageBlobGeo(0.18, 0.11, 0.16, 0, m.seed + d * 3), stoneMat);
                        chunk.position.set(Math.cos(ang) * dist, 0.08, Math.sin(ang) * dist);
                        debrisGrp.add(chunk);
                    }

                    if (sp === 0) {
                        // 1. Лесной алтарь Кордона
                        const step1 = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.25, 0.18, 8), stoneMat);
                        step1.position.y = 0.09;
                        const step2 = new THREE.Mesh(new THREE.CylinderGeometry(0.82, 0.90, 0.16, 8), stoneMat);
                        step2.position.y = 0.26;
                        baseGrp.add(step1, step2);

                        const table = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.52, 0.68), stoneMat);
                        table.position.y = 0.60;
                        coreGrp.add(table);

                        // Joint-pivoted side steles (pivot at base Y=0.34 so they topple cleanly!)
                        breakL.position.set(-0.78, 0.34, -0.15);
                        const steleL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.15, 0.24), stoneMat);
                        steleL.position.set(0, 0.575, 0);
                        breakL.add(steleL);

                        breakR.position.set(0.78, 0.34, -0.15);
                        const steleR = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.15, 0.24), stoneMat);
                        steleR.position.set(0, 0.575, 0);
                        breakR.add(steleR);

                        relicPivot.position.set(0, 1.24, 0);
                        const idol = new THREE.Mesh(new THREE.OctahedronGeometry(0.22, 0), stoneMat);
                        const runeCore = new THREE.Mesh(new THREE.OctahedronGeometry(0.14, 0), glowMat);
                        relicPivot.add(idol, runeCore);

                        const runeStrip = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.24, 0.03), glowMat);
                        runeStrip.position.set(0, 0.60, 0.35);
                        glowRig.add(runeStrip);
                        addCandleCluster(baseGrp, -0.36, 0.86, 0.20);
                        addCandleCluster(baseGrp,  0.36, 0.86, 0.20);
                    } else if (sp === 1) {
                        // 2. Рунический валун (Clean Runic Monolith WITHOUT white parchment scroll)
                        const plinth = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 1.18, 0.16, 8), stoneMat);
                        plinth.position.y = 0.08;
                        baseGrp.add(plinth);

                        const monolith = new THREE.Mesh(new THREE.BoxGeometry(0.48, 1.65, 0.38), stoneMat);
                        monolith.position.y = 0.98;
                        coreGrp.add(monolith);

                        const runeFace = new THREE.Mesh(new THREE.BoxGeometry(0.32, 1.22, 0.03), glowMat);
                        runeFace.position.set(0, 1.02, 0.20);
                        glowRig.add(runeFace);

                        relicPivot.position.set(0, 2.08, 0);
                        const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.18, 0), glowMat);
                        crystal.scale.set(0.85, 1.45, 0.85);
                        relicPivot.add(crystal);

                        addOfferingBowl(baseGrp, -0.45, 0.16, 0.42);
                        addOfferingBowl(baseGrp,  0.45, 0.16, 0.42);

                        // Joint-pivoted flanking rune stones at plinth base
                        breakL.position.set(-0.82, 0.16, 0.22);
                        const rStoneL = new THREE.Mesh(createFoliageBlobGeo(0.24, 0.42, 0.22, 0, m.seed + 1), stoneMat);
                        rStoneL.position.set(0, 0.22, 0);
                        breakL.add(rStoneL);

                        breakR.position.set(0.82, 0.16, 0.22);
                        const rStoneR = new THREE.Mesh(createFoliageBlobGeo(0.24, 0.42, 0.22, 0, m.seed + 2), stoneMat);
                        rStoneR.position.set(0, 0.22, 0);

                // Build 5 Complete Multi-Track AnimationClips (100% QuaternionKeyframeTrack + VectorKeyframeTrack) for Godot 4
                function makeQuatTrack(nodeName, times, eulerList) {
                    const values = [];
                    const e = new THREE.Euler(0, 0, 0, 'XYZ');
                    const q = new THREE.Quaternion();
                    for (let i = 0; i < eulerList.length; i++) {
                        e.set(eulerList[i][0], eulerList[i][1], eulerList[i][2], 'XYZ');
                        q.setFromEuler(e);
                        values.push(q.x, q.y, q.z, q.w);
                    }
                    return new THREE.QuaternionKeyframeTrack(nodeName + '.quaternion', times, values);
                }
