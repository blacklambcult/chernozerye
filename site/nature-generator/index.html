<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fearless Knights of the Cordon // Генератор Природы 3D (Godot 4 .GLB)</title>
    <style>
        /* =========================================================
           1. RESET & TACTICAL GRAPHITE / CARROT-ORANGE PALETTE
           ========================================================= */
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c0c0d;
            color: #f7f7f7;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 12px;
            user-select: none;
            -webkit-user-select: none;
        }

        #viewport {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at 50% 42%, #191b20 0%, #0c0c0d 82%);
            touch-action: none;
        }

        #gl-canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            touch-action: none;
        }

        #gl-canvas.pixelated {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Optional VHS Scanlines Overlay (OFF by default) */
        #vhs-overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.28) 0px,
                    rgba(0, 0, 0, 0.28) 1px,
                    transparent 1px,
                    transparent 3px
                ),
                radial-gradient(circle at center, transparent 54%, rgba(0, 0, 0, 0.62) 100%);
        }

        #vhs-overlay.active {
            opacity: 1;
        }

        /* Engine Loading / Error Banner */
        #engine-banner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 40;
            max-width: 90%;
            width: 340px;
            background: rgba(22, 23, 26, 0.96);
            border: 1px solid #f36c24;
            border-radius: 10px;
            padding: 14px 16px;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85);
            display: none;
        }

        #engine-banner h3 {
            margin: 0 0 6px 0;
            color: #f36c24;
            font-size: 13px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        #engine-banner p {
            margin: 0;
            color: #c5cad2;
            line-height: 1.45;
            font-size: 11px;
        }

        /* =========================================================
           2. HUD LAYOUT (STUDIO LAYOUT)
           ========================================================= */
        #hud {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
        }

        .panel {
            pointer-events: auto;
            background: rgba(22, 23, 26, 0.94);
            border: 1px solid #2c2e33;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.68);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .top-stack {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 7px 10px 7px 52px;
        }

        @media (min-width: 680px) {
            .header-bar {
                padding-left: 12px;
            }
        }

        .header-titles {
            min-width: 0;
            flex: 1;
        }

        .rec-line {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 9px;
            letter-spacing: 0.05em;
            color: #f36c24;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #e09a2b;
            flex-shrink: 0;
        }

        .status-dot.ready {
            background: #38c97a;
        }

        .status-dot.error {
            background: #e04538;
        }

        .game-title {
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #f7f7f7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        /* 5 Category Buttons in 3+2 Top Grid */
        .cat-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
            padding: 5px;
        }

        .cat-grid button:nth-child(1) { grid-column: 1 / 3; }
        .cat-grid button:nth-child(2) { grid-column: 3 / 5; }
        .cat-grid button:nth-child(3) { grid-column: 5 / 7; }
        .cat-grid button:nth-child(4) { grid-column: 1 / 4; }
        .cat-grid button:nth-child(5) { grid-column: 4 / 7; }

        /* Bottom Stack */
        .bottom-stack {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-bottom: 48px;
        }

        @media (min-width: 680px) {
            .bottom-stack {
                padding-bottom: 6px;
            }
        }

        /* Lifecycle Animation Bar (3+3+1 Grid, shown ONLY when Category 5 is active) */
        .lifecycle-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            padding: 5px;
        }

        .lifecycle-bar button {
            min-height: 29px;
            padding: 5px 4px;
            font-size: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-cycle-full {
            grid-column: 1 / -1;
            background: linear-gradient(180deg, #57280f 0%, #381808 100%) !important;
            border-color: #f36c24 !important;
            color: #fff5ed !important;
            font-weight: 700;
        }

        /* Collapsible Bottom Dock */
        .drawer {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .drawer-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 6px 8px;
            background: rgba(14, 15, 18, 0.96);
            border-bottom: 1px solid #2c2e33;
        }

        .drawer.collapsed .drawer-bar {
            border-bottom: none;
        }

        .drawer-bar-left {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            flex: 1;
        }

        .dock-title {
            font-size: 10.5px;
            font-weight: 700;
            color: #f36c24;
            letter-spacing: 0.05em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .code-badge {
            font-size: 9.5px;
            padding: 2px 6px;
            border-radius: 5px;
            background: #0c0c0d;
            border: 1px solid #353840;
            color: #d8dce3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 155px;
        }

        .drawer-bar-right {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .drawer-body {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 44vh;
            overflow-y: auto;
        }

        .drawer.collapsed .drawer-body {
            display: none;
        }

        /* Tabs */
        .tabs-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .tab-pane {
            display: none;
            flex-direction: column;
            gap: 6px;
        }

        .tab-pane.active {
            display: flex;
        }

        /* =========================================================
           3. BUTTONS, PILLS, ROWS & SLIDERS
           ========================================================= */
        button {
            font-family: inherit;
            font-size: 11px;
            color: #f7f7f7;
            background: #1e2025;
            border: 1px solid #33363f;
            border-radius: 7px;
            padding: 6px 8px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            outline: none;
        }

        button:active {
            transform: translateY(1px);
        }

        button:hover {
            border-color: #545966;
            background: #262930;
        }

        .btn-icon {
            padding: 4px 8px;
            min-width: 30px;
            height: 28px;
        }

        .btn-icon.on {
            background: linear-gradient(180deg, #542710 0%, #361808 100%);
            border-color: #f36c24;
            color: #fff4eb;
        }

        .btn-cat {
            padding: 6px 4px;
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-cat.active {
            background: linear-gradient(180deg, #5e2c11 0%, #3d1b0a 100%);
            border-color: #f36c24;
            color: #ffffff;
            font-weight: 700;
        }

        .btn-tab.active {
            background: linear-gradient(180deg, #472310 0%, #2e160a 100%);
            border-color: #f36c24;
            color: #ffdec9;
            font-weight: 700;
        }

        /* Lifecycle Button Styles */
        .btn-lc-dormant {
            background: linear-gradient(180deg, #232730 0%, #171920 100%);
            border-color: #555f73;
            color: #dce2ed;
            font-weight: 700;
        }

        .btn-lc-activate {
            background: linear-gradient(180deg, #1b382f 0%, #11241e 100%);
            border-color: #42cf96;
            color: #e6fff6;
            font-weight: 700;
        }

        .btn-lc-active {
            background: linear-gradient(180deg, #2c2142 0%, #1d152b 100%);
            border-color: #8c66d9;
            color: #f2ebff;
            font-weight: 700;
        }

        .btn-lc-pulse {
            background: linear-gradient(180deg, #4a1c26 0%, #301118 100%);
            border-color: #d64562;
            color: #ffe8ed;
            font-weight: 700;
        }

        .btn-lc-destroy {
            background: linear-gradient(180deg, #472217 0%, #2e150e 100%);
            border-color: #de6035;
            color: #ffede6;
            font-weight: 700;
        }

        .btn-lc-broken {
            background: linear-gradient(180deg, #302522 0%, #1f1715 100%);
            border-color: #87665c;
            color: #ebd9d3;
            font-weight: 700;
        }

        .lifecycle-bar button.active-lc {
            box-shadow: 0 0 0 1px #f7f7f7 inset;
        }

        .btn-orange {
            background: linear-gradient(180deg, #632e12 0%, #421e0b 100%);
            border-color: #f36c24;
            color: #fff6f0;
            font-weight: 700;
        }

        .btn-godot {
            background: linear-gradient(180deg, #276e53 0%, #194d39 100%);
            border-color: #42a882;
            color: #eefff8;
            font-weight: 700;
        }

        .btn-toggle.on {
            background: linear-gradient(180deg, #572810 0%, #381909 100%);
            border-color: #f36c24;
            color: #fff4eb;
            font-weight: 700;
        }

        /* Parameter Rows & Pills */
        .mod-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: #101114;
            border: 1px solid #292b32;
            border-radius: 7px;
            padding: 5px 7px;
        }

        .mod-label {
            color: #9ba2b0;
            font-size: 10.5px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .mod-val {
            color: #f7f7f7;
            font-size: 11px;
            text-align: right;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-cycle {
            padding: 4px 10px;
            min-width: 30px;
            height: 26px;
            font-size: 12px;
            flex-shrink: 0;
        }

        .pill-group-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            flex: 1;
            max-width: 280px;
        }

        .pill-group-5 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            flex: 1;
            max-width: 270px;
        }

        .pill {
            padding: 4px 4px;
            font-size: 10px;
            background: #1a1c21;
            border-color: #30333c;
            color: #bcc3cf;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pill.active {
            background: #4f2610;
            border-color: #f36c24;
            color: #fff5ed;
            font-weight: 700;
        }

        .pill.active-n {
            background: #203629;
            border-color: #469c6a;
            color: #e6fff0;
            font-weight: 700;
        }

        .pill.active-d {
            background: #422b18;
            border-color: #d98336;
            color: #fff2e0;
            font-weight: 700;
        }

        .pill.active-c {
            background: #421b20;
            border-color: #d4424c;
            color: #ffe6e8;
            font-weight: 700;
        }

        .section-caption {
            font-size: 10px;
            color: #9ba2b0;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .state-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .state-card {
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            padding: 7px 7px;
            gap: 3px;
        }

        .state-card strong {
            font-size: 10.5px;
        }

        .state-card span {
            font-size: 9.5px;
            color: #9ba2b0;
            line-height: 1.3;
        }

        .export-opt-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 2px 2px;
            font-size: 10.5px;
            color: #c8ced9;
        }

        .check-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .check-label input[type="checkbox"] {
            accent-color: #f36c24;
            width: 15px;
            height: 15px;
            margin: 0;
            cursor: pointer;
        }

        .godot-tag {
            font-size: 10px;
            color: #828a99;
            white-space: nowrap;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .actions-grid button {
            padding: 8px 8px;
            font-size: 11px;
        }

        .ps1-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
        }

        @media (min-width: 500px) {
            .ps1-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #101114;
            border: 1px solid #292b32;
            border-radius: 7px;
            padding: 5px 8px;
        }

        .slider-row input[type="range"] {
            flex: 1;
            accent-color: #f36c24;
            height: 4px;
            cursor: pointer;
        }

        .slider-val {
            font-size: 10px;
            color: #f36c24;
            min-width: 48px;
            text-align: right;
        }

        /* Hide / Restore UI */
        #restore-ui-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 30;
            display: none;
            background: rgba(22, 23, 26, 0.94);
            border: 1px solid #f36c24;
            color: #ffdec9;
            padding: 7px 10px;
            border-radius: 7px;
        }

        body.ui-hidden #hud {
            display: none;
        }

        body.ui-hidden #restore-ui-btn {
            display: inline-flex;
        }

        /* Non-blocking Toast Message Box */
        #toast {
            position: fixed;
            top: 68px;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            z-index: 45;
            background: rgba(20, 38, 30, 0.96);
            border: 1px solid #42a882;
            color: #ebfff6;
            padding: 8px 14px;
            border-radius: 7px;
            font-size: 11px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.72);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            max-width: 90%;
            text-align: center;
        }

        #toast.error {
            background: rgba(48, 20, 22, 0.96);
            border-color: #e04d42;
            color: #ffe8e6;
        }

        #toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .hidden {
            display: none !important;
        }
        .library-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; }
        .library-actions input { flex: 1 1 180px; min-width: 0; color: #eee; background: #171b1c; border: 1px solid #746453; padding: 8px; }
    </style>
</head>
<body>
    <!-- Fullscreen 3D Viewport -->
    <div id="viewport">
        <canvas id="gl-canvas"></canvas>
    </div>

    <!-- Optional VHS Scanlines Overlay (OFF by default) -->
    <div id="vhs-overlay"></div>

    <!-- Engine Loading / Fallback Banner -->
    <div id="engine-banner">
        <h3 id="banner-title">ЗАГРУЗКА 3D-ДВИЖКА...</h3>
        <p id="banner-msg">Подключение Three.js r128 и GLTFExporter...</p>
    </div>

    <!-- Floating Restore UI Button -->
    <button type="button" id="restore-ui-btn" data-action="show-ui">👁 Показать UI</button>

    <!-- Non-blocking Toast -->
    <div id="toast"></div>

    <!-- HUD Overlay -->
    <div id="hud">
        <!-- Top Header Bar + 5 Category Buttons (3+2 Grid) -->
        <div class="top-stack">
            <div class="panel header-bar">
                <div class="header-titles">
                    <div class="rec-line">
                        <span id="status-dot" class="status-dot"></span>
                        <span id="status-text">ЗАГРУЗКА WEBGL... // УРМАН, НОЯБРЬ 2005</span>
                    </div>
                    <div class="game-title">FEARLESS KNIGHTS OF THE CORDON</div>
                </div>
                <div class="header-actions">
                    <button type="button" id="btn-grid-toggle" class="btn-icon" data-action="toggle-grid" title="Сетка тайла 4×4 м">#</button>
                    <button type="button" class="btn-icon" data-action="reset-cam" title="Сброс камеры">⌖</button>
                    <button type="button" id="btn-wire-top" class="btn-icon" data-action="toggle-wire" title="Сетка полигонов (Wireframe)">👁</button>
                </div>
            </div>

            <div class="panel cat-grid">
                <button type="button" class="btn-cat active" data-cat="tree">1. Деревья</button>
                <button type="button" class="btn-cat" data-cat="bush">2. Кусты</button>
                <button type="button" class="btn-cat" data-cat="rock">3. Камни и пни</button>
                <button type="button" class="btn-cat" data-cat="water">4. Водоёмы и тайлы</button>
                <button type="button" class="btn-cat" data-cat="mystic">5. Мистика и алтари</button>
            </div>
        </div>

        <!-- Bottom Lifecycle Bar (Category 5 only) + Collapsible Dock (starts collapsed) -->
        <div class="bottom-stack">
            <div id="lifecycle-bar" class="panel lifecycle-bar hidden">
                <button type="button" class="btn-lc-dormant" data-lc="Reset_Inactive">💤 Неактивен</button>
                <button type="button" class="btn-lc-activate" data-lc="Activate">✨ Активизация</button>
                <button type="button" class="btn-lc-active active-lc" data-lc="Ritual_Idle">🔮 Активен</button>
                <button type="button" class="btn-lc-pulse" data-lc="Anomaly_Pulse">⚡ Всплеск</button>
                <button type="button" class="btn-lc-destroy" data-lc="Destroy">💥 Разрушение</button>
                <button type="button" class="btn-lc-broken" data-lc="Broken_Static">🪨 Разрушен</button>
                <button type="button" class="btn-cycle-full" data-lc="Full_Cycle">▶ Полный цикл (Неактивен → Активизация → Активен → Разрушение → Разрушен)</button>
            </div>

            <div id="drawer" class="panel drawer collapsed">
                <div class="drawer-bar">
                    <div class="drawer-bar-left">
                        <span id="dock-title" class="dock-title">ДЕРЕВЬЯ</span>
                        <span id="preset-code" class="code-badge">tree_t1_h1_c0_n_s1</span>
                    </div>
                    <div class="drawer-bar-right">
                        <button type="button" class="btn-icon btn-orange" data-action="randomize" title="Случайный вид">🎲</button>
                        <button type="button" class="btn-icon btn-godot" data-action="export-glb" title="Экспорт .GLB">⬇ .GLB</button>
                        <button type="button" id="btn-toggle-drawer" class="btn-icon" data-action="toggle-drawer">Развернуть ▼</button>
                    </div>
                </div>

                <div class="library-actions">
                    <input id="nature-name" maxlength="80" autocomplete="off" aria-label="Название модели" placeholder="Название модели">
                    <button type="button" id="btn-save-nature" disabled>Сохранить в библиотеку</button>
                    <button type="button" id="btn-place-nature" class="btn-godot" disabled>Разместить в Quest Lab ↗</button>
                </div>
                <div class="drawer-body">
                    <!-- 3 Navigation Sub-Tabs -->
                    <div class="tabs-row">
                        <button type="button" class="btn-tab active" data-tab="params">1. ПАРАМЕТРЫ</button>
                        <button type="button" class="btn-tab" data-tab="state">2. СОСТОЯНИЕ</button>
                        <button type="button" class="btn-tab" data-tab="view">3. ВИД / PS1</button>
                    </div>

                    <!-- TAB 1: ПАРАМЕТРЫ -->
                    <div id="pane-params" class="tab-pane active">
                        <div id="dynamic-params" style="display: flex; flex-direction: column; gap: 6px;"></div>

                        <div class="export-opt-row">
                            <label class="check-label">
                                <input type="checkbox" id="chk-only-object" checked>
                                <span>Только объект (без земли)</span>
                            </label>
                            <span id="poly-counter" class="godot-tag">Y=0 • Godot 4</span>
                        </div>

                        <div class="actions-grid">
                            <button type="button" class="btn-orange" data-action="randomize">🎲 СЛУЧАЙНЫЙ ВИД</button>
                            <button type="button" class="btn-godot" data-action="export-glb">⬇ ЭКСПОРТ .GLB (GODOT)</button>
                        </div>
                    </div>

                    <!-- TAB 2: СОСТОЯНИЕ -->
                    <div id="pane-state" class="tab-pane">
                        <div class="section-caption">Состояние среды и скверны:</div>
                        <div class="state-cards">
                            <button type="button" class="pill state-card active-n" data-env-state="n">
                                <strong>Нормальное (n)</strong>
                                <span>Поздний ноябрь 2005, урман Башкирии</span>
                            </button>
                            <button type="button" class="pill state-card" data-env-state="d">
                                <strong>Погорелое (d)</strong>
                                <span>Обугленная кора без жёлтых полос и пепел</span>
                            </button>
                            <button type="button" class="pill state-card" data-env-state="c">
                                <strong>Культистское (c)</strong>
                                <span>Чёрная живица, ползучие корни и смола</span>
                            </button>
                        </div>
                    </div>

                    <!-- TAB 3: ВИД / PS1 -->
                    <div id="pane-view" class="tab-pane">
                        <div class="ps1-grid">
                            <button type="button" id="tog-jitter" class="btn-toggle" data-toggle="jitter">PS1 Jitter: ВЫКЛ</button>
                            <button type="button" id="tog-pixel" class="btn-toggle" data-toggle="pixel">PS1 Пиксели: ВЫКЛ</button>
                            <button type="button" id="tog-vhs" class="btn-toggle" data-toggle="vhs">VHS Шум: ВЫКЛ</button>
                            <button type="button" id="tog-wire" class="btn-toggle" data-toggle="wire">Сетка (Wire): ВЫКЛ</button>
                            <button type="button" id="tog-night" class="btn-toggle" data-toggle="nightFog">Ночь / Туман: ВЫКЛ</button>
                            <button type="button" id="tog-rotate" class="btn-toggle" data-toggle="autoRotate">Автовращ.: ВЫКЛ</button>
                        </div>

                        <div class="slider-row">
                            <span class="mod-label">Сила PS1 Jitter:</span>
                            <input type="range" id="rng-jitter" min="1" max="10" step="1" value="5">
                            <span id="lbl-jitter" class="slider-val">5 / 10</span>
                        </div>

                        <button type="button" data-action="reset-cam" style="width: 100%; padding: 8px;">⌖ Сброс облёта камеры</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../object-library/library.js?v=3"></script>
    <script>
        (function () {
            'use strict';

            /* =========================================================
               1. APPLICATION STATE & 5 CATEGORIES CATALOG
               ========================================================= */
            const state = {
                cat: 'tree',            // 'tree' | 'bush' | 'rock' | 'water' | 'mystic'
                activeTab: 'params',    // 'params' | 'state' | 'view'
                drawerCollapsed: true,  // Starts collapsed for clean 3D preview
                onlyObject: true,       // Excludes ground base from .GLB export
                envState: 'n',          // 'n' (normal) | 'd' (burned) | 'c' (cultist)
                showTileGrid: false,    // Toggleable 4x4m boundary overlay (excluded from .GLB)

                tree: {
                    species: 0, // 0..8 (9 species)
                    height: 1,  // 0=Молодое, 1=Среднее, 2=Вековое
                    canopy: 0,  // 0=Густая, 1=Ноябрь, 2=Опавшая
                    seed: 0     // 0..4
                },

                bush: {
                    species: 0, // 0..4 (5 types)
                    group: 0,   // 0=Одиночный, 1=Группа 3, 2=Заросль
                    density: 0, // 0=Пышный, 1=Средний, 2=Редкий
                    seed: 0     // 0..4
                },

                rock: {
                    species: 0, // 0..7 (8 types)
                    size: 1,    // 0=Малый, 1=Средний, 2=Крупный
                    moss: 1,    // 0=Сухой, 1=Замшелый, 2=Сырой
                    runeSym: 0, // 0..4 (for Runic Boundary Stone sp===4)
                    runeCol: 0, // 0..4
                    seed: 0     // 0..4
                },

                water: {
                    tile: 0,    // 0..10 (11 grid-snappable 4.0m x 4.0m tiles)
                    rot: 0,     // 0..3 (0, 90, 180, 270 deg)
                    depth: 1,   // 0=Мелко, 1=Норма, 2=Глубоко
                    seed: 0     // 0..4
                },

                mystic: {
                    shrine: 0,            // 0..4 (5 shrines)
                    altarState: 'active', // 'inactive' | 'active' | 'broken'
                    runeSym: 0,           // 0..4
                    runeCol: 0,           // 0..4
                    activeLc: 'Ritual_Idle',
                    seed: 0               // 0..4
                },

                // ALL PS1 post-FX & auto-rotate strictly OFF by default
                view: {
                    jitter: false,
                    jitterStrength: 5,
                    pixel: false,
                    vhs: false,
                    wire: false,
                    nightFog: false,
                    autoRotate: false
                }
            };

            const META = {
                tree: {
                    title: 'ДЕРЕВЬЯ',
                    species: [
                        '1/9 Береза',
                        '2/9 Сосна',
                        '3/9 Ель',
                        '4/9 Старый дуб',
                        '5/9 Сухостой',
                        '6/9 Осина (золотая)',
                        '7/9 Плакучая ива',
                        '8/9 Поваленный ветровал',
                        '9/9 Древо Живицы'
                    ],
                    heights: ['Молодое', 'Среднее', 'Вековое'],
                    canopies: ['Густая', 'Ноябрь', 'Опавшая']
                },
                bush: {
                    title: 'КУСТЫ',
                    species: [
                        '1/5 Орешник',
                        '2/5 Шиповник',
                        '3/5 Папоротник',
                        '4/5 Камыш и осока',
                        '5/5 Бурьян / Репейник'
                    ],
                    groups: ['Одиночный', 'Группа 3', 'Заросль'],
                    densities: ['Пышный', 'Средний', 'Редкий']
                },
                rock: {
                    title: 'КАМНИ И ПНИ',
                    species: [
                        '1/8 Лесной валун',
                        '2/8 Группа камней',
                        '3/8 Скальный выступ',
                        '4/8 Болотный камень',
                        '5/8 Рунический камень',
                        '6/8 Пень с опятами',
                        '7/8 Поваленный ствол',
                        '8/8 Трухлявый пень'
                    ],
                    sizes: ['Малый', 'Средний', 'Крупный'],
                    mosses: ['Сухой', 'Замшелый', 'Сырой']
                },
                runes: {
                    symbols: [
                        '1/5 Кордон (Щит)',
                        '2/5 Урман (Древо)',
                        '3/5 Живица (Око)',
                        '4/5 Путь (Стрела)',
                        '5/5 Скверна (Печать)'
                    ],
                    colors: [
                        { id: 0, label: 'Бирюза',   hex: 0x45f2e1, css: '#45f2e1' },
                        { id: 1, label: 'Багрец',   hex: 0xff3b5c, css: '#ff3b5c' },
                        { id: 2, label: 'Янтарь',   hex: 0xffaa2b, css: '#ffaa2b' },
                        { id: 3, label: 'Изумруд',  hex: 0x42f57b, css: '#42f57b' },
                        { id: 4, label: 'Аметист',  hex: 0xb85cff, css: '#b85cff' }
                    ]
                },
                water: {
                    title: 'ВОДОЁМЫ И ТАЙЛЫ',
                    tiles: [
                        '1/11 Болото: Центр трясины',
                        '2/11 Болото: Берег (край)',
                        '3/11 Болото: Угол берега',
                        '4/11 Болото: Деревянная гать',
                        '5/11 Река: Прямое русло',
                        '6/11 Река: Поворот 90°',
                        '7/11 Река: Развилка / Устье',
                        '8/11 Река: Брод с мостками',
                        '9/11 Озеро: Центр воды',
                        '10/11 Озеро: Прямой берег',
                        '11/11 Озеро: Угол залива'
                    ],
                    rots: ['0°', '90°', '180°', '270°'],
                    depths: ['Мелко', 'Норма', 'Глубоко']
                },
                mystic: {
                    title: 'СВЯТИЛИЩЕ',
                    shrines: [
                        '1/5 Лесной алтарь Кордона',
                        '2/5 Рунический валун',
                        '3/5 Тотем Чёрной живицы',
                        '4/5 Ведьмин круг и очаг',
                        '5/5 Дерево-фонарь'
                    ],
                    altarStates: [
                        { id: 'inactive', label: 'Неактивный' },
                        { id: 'active',   label: 'Активный' },
                        { id: 'broken',   label: 'Разрушенный' }
                    ]
                }
            };

            /* =========================================================
               2. CONFIG FILENAME CODE, TOAST & ENGINE HOOKS
               ========================================================= */
            function getConfigCode() {
                const c = state.cat;
                const e = state.envState;
                if (c === 'tree') {
                    const t = state.tree;
                    return 'tree_t' + (t.species + 1) + '_h' + t.height + '_c' + t.canopy + '_' + e + '_s' + (t.seed + 1);
                }
                if (c === 'bush') {
                    const b = state.bush;
                    return 'bush_t' + (b.species + 1) + '_g' + b.group + '_d' + b.density + '_' + e + '_s' + (b.seed + 1);
                }
                if (c === 'rock') {
                    const r = state.rock;
                    const rTag = r.species === 4 ? ('_r' + (r.runeSym + 1) + 'c' + (r.runeCol + 1)) : '';
                    return 'rock_t' + (r.species + 1) + '_sz' + r.size + '_m' + r.moss + rTag + '_' + e + '_s' + (r.seed + 1);
                }
                if (c === 'water') {
                    const w = state.water;
                    return 'tile4m_w' + (w.tile + 1) + '_r' + (w.rot * 90) + '_d' + w.depth + '_' + e + '_s' + (w.seed + 1);
                }
                const m = state.mystic;
                return 'mystic_a' + (m.shrine + 1) + '_' + m.altarState + '_r' + (m.runeSym + 1) + 'c' + (m.runeCol + 1) + '_' + e + '_s' + (m.seed + 1);
            }

            let toastTimer = null;
            function showToast(msg, isError) {
                const el = document.getElementById('toast');
                if (!el) return;
                el.textContent = msg;
                el.classList.toggle('error', !!isError);
                el.classList.add('visible');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(function () { el.classList.remove('visible'); }, 2800);
            }

            function setStatus(mode, text) {
                const dot = document.getElementById('status-dot');
                const txt = document.getElementById('status-text');
                if (dot) {
                    dot.classList.remove('ready', 'error');
                    if (mode === 'ready') dot.classList.add('ready');
                    if (mode === 'error') dot.classList.add('error');
                }
                if (txt && text) txt.textContent = text;
            }

            function setBanner(visible, title, msg) {
                const box = document.getElementById('engine-banner');
                if (!box) return;
                box.style.display = visible ? 'block' : 'none';
                if (title) document.getElementById('banner-title').textContent = title;
                if (msg) document.getElementById('banner-msg').textContent = msg;
            }

            // Populated after Three.js boots
            let rebuildScene = function () {};
            let resetCamera = function () {};
            let applyViewSettings = function () {};
            let triggerMysticLifecycle = function () {};
            let exportGLB = function () { showToast('3D-движок ещё загружается...', true); };

            /* =========================================================
               3. IMMEDIATE UI SYNC & DELEGATED EVENT LISTENERS
               ========================================================= */
            function renderSeedPills(currentSeed) {
                let html = '<div class="mod-row"><span class="mod-label">Вариант (Seed):</span><div class="pill-group-5">';
                for (let i = 0; i < 5; i++) {
                    html += '<button type="button" class="pill' + (currentSeed === i ? ' active' : '') + '" data-seed="' + i + '">#' + (i + 1) + '</button>';
                }
                html += '</div></div>';
                return html;
            }

            function renderRuneControls(runeSym, runeCol) {
                let html =
                    '<div class="mod-row"><span class="mod-label">Символ руны:</span><span class="mod-val">' +
                    META.runes.symbols[runeSym] +
                    '</span><button type="button" class="btn-cycle" data-cycle="runeSym">↻</button></div>' +
                    '<div class="mod-row"><span class="mod-label">Цвет свечения:</span><div class="pill-group-5">';
                for (let i = 0; i < META.runes.colors.length; i++) {
                    const col = META.runes.colors[i];
                    const isAct = runeCol === i;
                    const borderStyle = isAct ? (' style="border-color:' + col.css + ';color:' + col.css + ';"') : '';
                    html += '<button type="button" class="pill' + (isAct ? ' active' : '') + '"' + borderStyle + ' data-prop="runeCol" data-val="' + i + '">' + col.label + '</button>';
                }
                html += '</div></div>';
                return html;
            }

            function renderDynamicParams() {
                const box = document.getElementById('dynamic-params');
                if (!box) return;
                const c = state.cat;
                let html = '';

                if (c === 'tree') {
                    const t = state.tree;
                    html +=
                        '<div class="mod-row"><span class="mod-label">Порода:</span><span class="mod-val">' + META.tree.species[t.species] + '</span><button type="button" class="btn-cycle" data-cycle="species">↻</button></div>' +
                        '<div class="mod-row"><span class="mod-label">Высота:</span><div class="pill-group-3">' +
                        META.tree.heights.map(function (lbl, idx) {
                            return '<button type="button" class="pill' + (t.height === idx ? ' active' : '') + '" data-prop="height" data-val="' + idx + '">' + lbl + '</button>';
                        }).join('') +
                        '</div></div>' +
                        '<div class="mod-row"><span class="mod-label">Крона:</span><div class="pill-group-3">' +
                        META.tree.canopies.map(function (lbl, idx) {
                            return '<button type="button" class="pill' + (t.canopy === idx ? ' active' : '') + '" data-prop="canopy" data-val="' + idx + '">' + lbl + '</button>';
                        }).join('') +
                        '</div></div>' +
                        renderSeedPills(t.seed);
                } else if (c === 'bush') {
                    const b = state.bush;
                    html +=
                        '<div class="mod-row"><span class="mod-label">Вид:</span><span class="mod-val">' + META.bush.species[b.species] + '</span><button type="button" class="btn-cycle" data-cycle="species">↻</button></div>' +
                        '<div class="mod-row"><span class="mod-label">Группа:</span><div class="pill-group-3">' +
                        META.bush.groups.map(function (lbl, idx) {
                            return '<button type="button" class="pill' + (b.group === idx ? ' active' : '') + '" data-prop="group" data-val="' + idx + '">' + lbl + '</button>';
                        }).join('') +
                        '</div></div>' +
                        '<div class="mod-row"><span class="mod-label">Плотность:</span><div class="pill-group-3">' +
                        META.bush.densities.map(function (lbl, idx) {
                            return '<button type="button" class="pill' + (b.density === idx ? ' active' : '') + '" data-prop="density" data-val="' + idx + '">' + lbl + '</button>';
                        }).join('') +
                        '</div></div>' +
                        renderSeedPills(b.seed);
                } else if (c === 'rock') {
                    const r = state.rock;
                    html +=
                        '<div class="mod-row"><span class="mod-label">Тип:</span><span class="mod-val">' + META.rock.species[r.species] + '</span><button type="button" class="btn-cycle" data-cycle="species">↻</button></div>' +
                        '<div class="mod-row"><span class="mod-label">Размер:</span><div class="pill-group-3">' +
                        META.rock.sizes.map(function (lbl, idx) {
                            return '<button type="button" class="pill' + (r.size === idx ? ' active' : '') + '" data-prop="size" data-val="' + idx + '">' + lbl + '</button>';
                        }).join('') +
                        '</div></div>' +
                        '<div class="mod-row"><span class="mod-label">Покрытие:</span><div class="pill-group-3">' +
                        META.rock.mosses.map(function (lbl, idx) {
                            return '<button type="button" class="pill' + (r.moss === idx ? ' active' : '') + '" data-prop="moss" data-val="' + idx + '">' + lbl + '</button>';
                        }).join('') +
                        '</div></div>';
                    if (r.species === 4) {
                        html += renderRuneControls(r.runeSym, r.runeCol);
                    }
                    html += renderSeedPills(r.seed);
                } else if (c === 'water') {
                    const w = state.water;
                    html +=
                        '<div class="mod-row"><span class="mod-label">Модуль 4×4м:</span><span class="mod-val">' + META.water.tiles[w.tile] + '</span><button type="button" class="btn-cycle" data-cycle="tile">↻</button></div>' +
                        '<div class="mod-row"><span class="mod-label">Поворот:</span><div class="pill-group-3" style="grid-template-columns: repeat(4, 1fr);">' +
                        META.water.rots.map(function (lbl, idx) {
                            return '<button type="button" class="pill' + (w.rot === idx ? ' active' : '') + '" data-prop="rot" data-val="' + idx + '">' + lbl + '</button>';
                        }).join('') +
                        '</div></div>' +
                        '<div class="mod-row"><span class="mod-label">Берег/Глуб.:</span><div class="pill-group-3">' +
                        META.water.depths.map(function (lbl, idx) {
                            return '<button type="button" class="pill' + (w.depth === idx ? ' active' : '') + '" data-prop="depth" data-val="' + idx + '">' + lbl + '</button>';
                        }).join('') +
                        '</div></div>' +
                        renderSeedPills(w.seed);
                } else {
                    const m = state.mystic;
                    html +=
                        '<div class="mod-row"><span class="mod-label">Святилище:</span><span class="mod-val">' + META.mystic.shrines[m.shrine] + '</span><button type="button" class="btn-cycle" data-cycle="shrine">↻</button></div>' +
                        '<div class="mod-row"><span class="mod-label">Сост. алтаря:</span><div class="pill-group-3">' +
                        META.mystic.altarStates.map(function (st) {
                            return '<button type="button" class="pill' + (m.altarState === st.id ? ' active' : '') + '" data-altar-state="' + st.id + '">' + st.label + '</button>';
                        }).join('') +
                        '</div></div>' +
                        renderRuneControls(m.runeSym, m.runeCol) +
                        renderSeedPills(m.seed);
                }

                box.innerHTML = html;
            }

            function syncUI() {
                const c = state.cat;

                document.querySelectorAll('[data-cat]').forEach(function (b) {
                    b.classList.toggle('active', b.dataset.cat === c);
                });

                // Lifecycle bar shown ONLY when Category 5 ('mystic') is active
                const lcBar = document.getElementById('lifecycle-bar');
                lcBar.classList.toggle('hidden', c !== 'mystic');
                document.querySelectorAll('[data-lc]').forEach(function (b) {
                    b.classList.toggle('active-lc', b.dataset.lc === state.mystic.activeLc);
                });

                document.getElementById('dock-title').textContent = META[c].title;
                document.getElementById('preset-code').textContent = getConfigCode();

                document.getElementById('drawer').classList.toggle('collapsed', state.drawerCollapsed);
                document.getElementById('btn-toggle-drawer').textContent = state.drawerCollapsed ? 'Развернуть ▼' : 'Свернуть ▲';

                document.querySelectorAll('[data-tab]').forEach(function (b) {
                    b.classList.toggle('active', b.dataset.tab === state.activeTab);
                });
                document.getElementById('pane-params').classList.toggle('active', state.activeTab === 'params');
                document.getElementById('pane-state').classList.toggle('active', state.activeTab === 'state');
                document.getElementById('pane-view').classList.toggle('active', state.activeTab === 'view');

                renderDynamicParams();

                // Environment State cards
                document.querySelectorAll('[data-env-state]').forEach(function (b) {
                    const v = b.dataset.envState;
                    b.classList.remove('active-n', 'active-d', 'active-c');
                    if (state.envState === v) b.classList.add('active-' + v);
                });

                // Top icon toggles
                document.getElementById('btn-grid-toggle').classList.toggle('on', state.showTileGrid);
                document.getElementById('btn-wire-top').classList.toggle('on', state.view.wire);

                // View / PS1 toggles
                const setTog = function (id, label, on) {
                    const el = document.getElementById(id);
                    if (!el) return;
                    el.textContent = label + ': ' + (on ? 'ВКЛ' : 'ВЫКЛ');
                    el.classList.toggle('on', on);
                };
                setTog('tog-jitter', 'PS1 Jitter', state.view.jitter);
                setTog('tog-pixel', 'PS1 Пиксели', state.view.pixel);
                setTog('tog-vhs', 'VHS Шум', state.view.vhs);
                setTog('tog-wire', 'Сетка (Wire)', state.view.wire);
                setTog('tog-night', 'Ночь / Туман', state.view.nightFog);
                setTog('tog-rotate', 'Автовращ.', state.view.autoRotate);

                document.getElementById('rng-jitter').value = state.view.jitterStrength;
                document.getElementById('lbl-jitter').textContent = state.view.jitterStrength + ' / 10';
            }

            function randomizeCurrent() {
                const c = state.cat;
                const envs = ['n', 'd', 'c'];
                state.envState = envs[Math.floor(Math.random() * 3)];

                if (c === 'tree') {
                    state.tree.species = Math.floor(Math.random() * META.tree.species.length);
                    state.tree.height = Math.floor(Math.random() * 3);
                    state.tree.canopy = Math.floor(Math.random() * 3);
                    state.tree.seed = Math.floor(Math.random() * 5);
                } else if (c === 'bush') {
                    state.bush.species = Math.floor(Math.random() * META.bush.species.length);
                    state.bush.group = Math.floor(Math.random() * 3);
                    state.bush.density = Math.floor(Math.random() * 3);
                    state.bush.seed = Math.floor(Math.random() * 5);
                } else if (c === 'rock') {
                    state.rock.species = Math.floor(Math.random() * META.rock.species.length);
                    state.rock.size = Math.floor(Math.random() * 3);
                    state.rock.moss = Math.floor(Math.random() * 3);
                    state.rock.runeSym = Math.floor(Math.random() * META.runes.symbols.length);
                    state.rock.runeCol = Math.floor(Math.random() * META.runes.colors.length);
                    state.rock.seed = Math.floor(Math.random() * 5);
                } else if (c === 'water') {
                    state.water.tile = Math.floor(Math.random() * META.water.tiles.length);
                    state.water.rot = Math.floor(Math.random() * 4);
                    state.water.depth = Math.floor(Math.random() * 3);
                    state.water.seed = Math.floor(Math.random() * 5);
                } else {
                    state.mystic.shrine = Math.floor(Math.random() * META.mystic.shrines.length);
                    const stList = ['inactive', 'active', 'broken'];
                    state.mystic.altarState = stList[Math.floor(Math.random() * 3)];
                    state.mystic.runeSym = Math.floor(Math.random() * META.runes.symbols.length);
                    state.mystic.runeCol = Math.floor(Math.random() * META.runes.colors.length);
                    state.mystic.seed = Math.floor(Math.random() * 5);
                }

                syncUI();
                rebuildScene();
            }

            // Delegated event listener attached immediately BEFORE WebGL initializes
            document.addEventListener('click', function (e) {
                const btn = e.target.closest('button');
                if (!btn) return;

                if (btn.dataset.cat) {
                    const next = btn.dataset.cat;
                    if (state.cat !== next) {
                        state.cat = next;
                        if (next === 'water') state.showTileGrid = true;
                        syncUI();
                        rebuildScene();
                        resetCamera();
                    }
                    return;
                }

                if (btn.dataset.tab) {
                    state.activeTab = btn.dataset.tab;
                    syncUI();
                    return;
                }

                if (btn.dataset.cycle) {
                    const key = btn.dataset.cycle;
                    const c = state.cat;
                    const lenMap = {
                        species: META[c].species ? META[c].species.length : 1,
                        tile: META.water.tiles.length,
                        shrine: META.mystic.shrines.length,
                        runeSym: META.runes.symbols.length
                    };
                    state[c][key] = (state[c][key] + 1) % (lenMap[key] || 1);
                    syncUI();
                    rebuildScene();
                    return;
                }

                if (btn.dataset.prop) {
                    state[state.cat][btn.dataset.prop] = Number(btn.dataset.val);
                    syncUI();
                    rebuildScene();
                    return;
                }

                if (btn.dataset.seed !== undefined) {
                    state[state.cat].seed = Number(btn.dataset.seed);
                    syncUI();
                    rebuildScene();
                    return;
                }

                if (btn.dataset.altarState) {
                    state.mystic.altarState = btn.dataset.altarState;
                    state.mystic.activeLc =
                        state.mystic.altarState === 'inactive' ? 'Reset_Inactive' :
                        (state.mystic.altarState === 'broken' ? 'Broken_Static' : 'Ritual_Idle');
                    syncUI();
                    rebuildScene();
                    return;
                }

                if (btn.dataset.envState) {
                    state.envState = btn.dataset.envState;
                    syncUI();
                    rebuildScene();
                    return;
                }

                if (btn.dataset.lc) {
                    triggerMysticLifecycle(btn.dataset.lc);
                    return;
                }

                if (btn.dataset.toggle) {
                    const key = btn.dataset.toggle;
                    state.view[key] = !state.view[key];
                    syncUI();
                    applyViewSettings();
                    return;
                }

                const act = btn.dataset.action;
                if (act === 'hide-ui') {
                    document.body.classList.add('ui-hidden');
                } else if (act === 'show-ui') {
                    document.body.classList.remove('ui-hidden');
                } else if (act === 'toggle-drawer') {
                    state.drawerCollapsed = !state.drawerCollapsed;
                    syncUI();
                } else if (act === 'toggle-grid') {
                    state.showTileGrid = !state.showTileGrid;
                    syncUI();
                    applyViewSettings();
                } else if (act === 'toggle-wire') {
                    state.view.wire = !state.view.wire;
                    syncUI();
                    applyViewSettings();
                } else if (act === 'randomize') {
                    randomizeCurrent();
                } else if (act === 'export-glb') {
                    exportGLB();
                } else if (act === 'reset-cam') {
                    resetCamera();
                }
            });

            document.addEventListener('change', function (e) {
                if (e.target && e.target.id === 'chk-only-object') {
                    state.onlyObject = !!e.target.checked;
                }
            });

            document.addEventListener('input', function (e) {
                if (e.target && e.target.id === 'rng-jitter') {
                    state.view.jitterStrength = parseInt(e.target.value, 10);
                    syncUI();
                    applyViewSettings();
                }
            });

            syncUI();

            /* =========================================================
               4. CASCADING UMD CDN LOADER (cdnjs -> jsdelivr -> unpkg)
               ========================================================= */
            function reportFatalError(title, detail) {
                setStatus('error', title || 'ОШИБКА СКРИПТА');
                setBanner(true, title || 'ОШИБКА 3D-ДВИЖКА', String(detail || 'Неизвестная ошибка'));
            }

            window.onerror = function (msg, src, line, col, err) {
                const info = (err && err.message) ? err.message : (msg + ' (' + line + ':' + col + ')');
                reportFatalError('ОШИБКА JS / WEBGL', info);
            };

            window.addEventListener('unhandledrejection', function (e) {
                const reason = e && e.reason ? (e.reason.message || String(e.reason)) : 'Promise rejected';
                reportFatalError('ОШИБКА ЗАГРУЗКИ', reason);
            });

            function loadScript(url, timeoutMs) {
                return new Promise(function (resolve, reject) {
                    let settled = false;
                    const s = document.createElement('script');
                    s.src = url;
                    s.async = true;

                    const timer = setTimeout(function () {
                        if (settled) return;
                        settled = true;
                        s.remove();
                        reject(new Error('Timeout loading ' + url));
                    }, timeoutMs || 6000);

                    s.onload = function () {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timer);
                        resolve();
                    };
                    s.onerror = function () {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timer);
                        s.remove();
                        reject(new Error('Failed to load ' + url));
                    };
                    document.head.appendChild(s);
                });
            }

            async function loadWithFallback(urls) {
                let lastErr = null;
                for (let i = 0; i < urls.length; i++) {
                    try {
                        await loadScript(urls[i], 6000);
                        return true;
                    } catch (err) {
                        lastErr = err;
                    }
                }
                throw lastErr || new Error('All CDN mirrors failed');
            }

            async function bootEngine() {
                setBanner(true, 'ЗАГРУЗКА 3D-ДВИЖКА...', 'Подключение Three.js r128 и GLTFExporter...');
                try {
                    if (typeof window.THREE === 'undefined') {
                        await loadWithFallback([
                            'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
                            'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
                            'https://unpkg.com/three@0.128.0/build/three.min.js'
                        ]);
                    }
                    if (typeof window.THREE.GLTFExporter === 'undefined') {
                        await loadWithFallback([
                            'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/exporters/GLTFExporter.js',
                            'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js',
                            'https://unpkg.com/three@0.128.0/examples/js/exporters/GLTFExporter.js'
                        ]).catch(function () {
                            showToast('GLTFExporter недоступен (превью работает)', true);
                        });
                    }
                    setBanner(false);
                    init3D();
                } catch (err) {
                    reportFatalError('ОШИБКА ЗАГРУЗКИ CDN', err && err.message ? err.message : 'Не удалось загрузить Three.js с CDN.');
                }
            }

            /* =========================================================
               5. THREE.JS ENGINE, WINDING VERIFICATION & 5 GENERATORS
               ========================================================= */
            function init3D() {
                const canvas = document.getElementById('gl-canvas');
                let renderer;
                try {
                    renderer = new THREE.WebGLRenderer({
                        canvas: canvas,
                        antialias: true,
                        alpha: false,
                        powerPreference: 'high-performance'
                    });
                } catch (err) {
                    setStatus('error', 'WEBGL НЕДОСТУПЕН');
                    showToast('WebGL недоступен. Генерация и экспорт доступны без предпросмотра.', true);
                }

                if (renderer) {
                    renderer.outputEncoding = THREE.sRGBEncoding;
                    renderer.setClearColor(0x13151a, 1);
                }

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(45, window.innerWidth / Math.max(1, window.innerHeight), 0.08, 80);

                // Clean Studio Lighting ON by default
                const hemiLight = new THREE.HemisphereLight(0xf2f6fa, 0x353940, 0.98);
                scene.add(hemiLight);

                const sunLight = new THREE.DirectionalLight(0xfff4e4, 1.15);
                sunLight.position.set(6.5, 10.5, 7.5);
                scene.add(sunLight);

                const rimLight = new THREE.DirectionalLight(0x7c97b2, 0.50);
                rimLight.position.set(-7.0, 5.0, -6.5);
                scene.add(rimLight);

                // Preview Shrine & Rune Glow Light (NEVER exported to .GLB!)
                const shrinePreviewLight = new THREE.PointLight(0x45f2e1, 0, 5.5);
                scene.add(shrinePreviewLight);

                /* ---------------------------------------------------------
                   5.1 BUILT-IN SMOOTH ORBITAL CAMERA CONTROLLER
                   --------------------------------------------------------- */
                const orbit = {
                    theta: 0.65,
                    phi: 1.14,
                    radius: 7.4,
                    target: new THREE.Vector3(0, 1.7, 0),
                    desiredTheta: 0.65,
                    desiredPhi: 1.14,
                    desiredRadius: 7.4,
                    desiredTarget: new THREE.Vector3(0, 1.7, 0),
                    mode: 'none',
                    lastX: 0,
                    lastY: 0,
                    pinchDist: 0
                };

                function clampOrbit() {
                    orbit.desiredPhi = Math.max(0.14, Math.min(Math.PI * 0.495, orbit.desiredPhi));
                    orbit.desiredRadius = Math.max(1.1, Math.min(24.0, orbit.desiredRadius));
                    orbit.phi = Math.max(0.14, Math.min(Math.PI * 0.495, orbit.phi));
                    orbit.radius = Math.max(1.1, Math.min(24.0, orbit.radius));
                }

                function updateCameraTransform() {
                    clampOrbit();
                    const sinPhi = Math.sin(orbit.phi);
                    camera.position.set(
                        orbit.target.x + orbit.radius * sinPhi * Math.sin(orbit.theta),
                        orbit.target.y + orbit.radius * Math.cos(orbit.phi),
                        orbit.target.z + orbit.radius * sinPhi * Math.cos(orbit.theta)
                    );
                    camera.lookAt(orbit.target);
                }

                resetCamera = function () {
                    const c = state.cat;
                    if (c === 'tree') {
                        const hScale = [0.75, 1.0, 1.32][state.tree.height];
                        orbit.desiredTheta = 0.62;
                        orbit.desiredPhi = 1.16;
                        orbit.desiredRadius = 7.4 * hScale;
                        orbit.desiredTarget.set(0, 1.85 * hScale, 0);
                    } else if (c === 'bush') {
                        orbit.desiredTheta = 0.58;
                        orbit.desiredPhi = 1.08;
                        orbit.desiredRadius = 3.2;
                        orbit.desiredTarget.set(0, 0.48, 0);
                    } else if (c === 'rock') {
                        orbit.desiredTheta = 0.64;
                        orbit.desiredPhi = 1.06;
                        orbit.desiredRadius = 3.4;
                        orbit.desiredTarget.set(0, 0.45, 0);
                    } else if (c === 'water') {
                        orbit.desiredTheta = 0.58;
                        orbit.desiredPhi = 0.92;
                        orbit.desiredRadius = 6.6;
                        orbit.desiredTarget.set(0, 0.15, 0);
                    } else {
                        orbit.desiredTheta = 0.56;
                        orbit.desiredPhi = 1.08;
                        orbit.desiredRadius = 4.6;
                        orbit.desiredTarget.set(0, 1.05, 0);
                    }
                    orbit.theta = orbit.desiredTheta;
                    orbit.phi = orbit.desiredPhi;
                    orbit.radius = orbit.desiredRadius;
                    orbit.target.copy(orbit.desiredTarget);
                    updateCameraTransform();
                };

                canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
                canvas.addEventListener('mousedown', function (e) {
                    orbit.mode = e.button === 2 ? 'pan' : 'rotate';
                    orbit.lastX = e.clientX;
                    orbit.lastY = e.clientY;
                });
                window.addEventListener('mousemove', function (e) {
                    if (orbit.mode === 'none') return;
                    const dx = e.clientX - orbit.lastX;
                    const dy = e.clientY - orbit.lastY;
                    orbit.lastX = e.clientX;
                    orbit.lastY = e.clientY;
                    if (orbit.mode === 'rotate') {
                        orbit.desiredTheta -= dx * 0.0085;
                        orbit.desiredPhi -= dy * 0.0085;
                    } else if (orbit.mode === 'pan') {
                        const panScale = orbit.radius * 0.0014;
                        const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
                        const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
                        orbit.desiredTarget.addScaledVector(right, -dx * panScale);
                        orbit.desiredTarget.addScaledVector(up, dy * panScale);
                    }
                });
                window.addEventListener('mouseup', function () { orbit.mode = 'none'; });
                canvas.addEventListener('wheel', function (e) {
                    e.preventDefault();
                    orbit.desiredRadius += e.deltaY * 0.005;
                }, { passive: false });

                canvas.addEventListener('touchstart', function (e) {
                    if (e.touches.length === 1) {
                        orbit.mode = 'rotate';
                        orbit.lastX = e.touches[0].clientX;
                        orbit.lastY = e.touches[0].clientY;
                    } else if (e.touches.length === 2) {
                        orbit.mode = 'pinch';
                        orbit.pinchDist = Math.hypot(
                            e.touches[0].clientX - e.touches[1].clientX,
                            e.touches[0].clientY - e.touches[1].clientY
                        );
                    }
                }, { passive: true });
                canvas.addEventListener('touchmove', function (e) {
                    if (e.touches.length === 1 && orbit.mode === 'rotate') {
                        const dx = e.touches[0].clientX - orbit.lastX;
                        const dy = e.touches[0].clientY - orbit.lastY;
                        orbit.lastX = e.touches[0].clientX;
                        orbit.lastY = e.touches[0].clientY;
                        orbit.desiredTheta -= dx * 0.0095;
                        orbit.desiredPhi -= dy * 0.0095;
                    } else if (e.touches.length === 2) {
                        const d = Math.hypot(
                            e.touches[0].clientX - e.touches[1].clientX,
                            e.touches[0].clientY - e.touches[1].clientY
                        );
                        orbit.desiredRadius += (orbit.pinchDist - d) * 0.018;
                        orbit.pinchDist = d;

                canvas.addEventListener('touchend', function () { orbit.mode = 'none'; });

                /* ---------------------------------------------------------
                   5.2 PROCEDURAL PS1 PIXEL TEXTURES (NearestFilter)

                function prng(seed) {
                    let s = (seed + 17) % 2147483647;
                    if (s <= 0) s += 2147483646;
                    return function () {
                        s = (s * 16807) % 2147483647;
                        return (s - 1) / 2147483646;
                    };

                    const tex = new THREE.CanvasTexture(c);
                    tex.magFilter = THREE.NearestFilter;
                    tex.minFilter = THREE.NearestFilter;
                    tex.generateMipmaps = false;
                    tex.wrapS = THREE.RepeatWrapping;
                    tex.wrapT = THREE.RepeatWrapping;
                    tex.repeat.set(repX || 1, repY || 1);
                    tex.encoding = THREE.sRGBEncoding;
                    return tex;

                        ctx.fillStyle = '#212b1e';

                        for (let i = 0; i < 160; i++) {
                            const v = r();
                            ctx.fillStyle = v < 0.45 ? '#354d27' : (v < 0.78 ? '#182116' : '#466133');
                            ctx.fillRect(Math.floor(r() * w), Math.floor(r() * h), 4, 3);
                        }
                    }, 2, 2),

                    riverWater: makePixelTex(64, function (ctx, w, h) {
                        const r = prng(304);
                        ctx.fillStyle = '#1f3640';
                        ctx.fillRect(0, 0, w, h);
                        for (let y = 0; y < h; y += 6) {
                            ctx.fillStyle = y % 12 === 0 ? '#2b4957' : '#182b33';
                            ctx.fillRect(0, y, w, 2);
                        }
                        for (let i = 0; i < 70; i++) {
                            ctx.fillStyle = '#385c6b';
                            ctx.fillRect(Math.floor(r() * w), Math.floor(r() * h), 6, 2);
                        }
                    }, 2, 2),

                    planks: makePixelTex(64, function (ctx, w, h) {
                        const r = prng(305);
                        ctx.fillStyle = '#5c4632';
                        ctx.fillRect(0, 0, w, h);
                        for (let x = 0; x < w; x += 8) {
                            ctx.fillStyle = r() > 0.5 ? '#6b523b' : '#4d3a29';
                            ctx.fillRect(x, 0, 7, h);
                            ctx.fillStyle = '#291e15';
                            ctx.fillRect(x + 7, 0, 1, h);
                        }
                    }, 1, 1),

                    forestFloor: makePixelTex(128, function (ctx, w, h) {
                        const r = prng(309);
                        ctx.fillStyle = '#2e2b21';
                        ctx.fillRect(0, 0, w, h);
                        const cols = ['#383426', '#25261c', '#453e2b', '#2b3020'];
                        for (let i = 0; i < 480; i++) {
                            ctx.fillStyle = cols[Math.floor(r() * cols.length)];
                            ctx.fillRect(Math.floor(r() * w), Math.floor(r() * h), 5, 4);
                        }
                    }, 3, 3)
                };

                // 5 Procedural PS1 Rune Symbol Textures (white glyphs on dark stone for color tinting)
                const RUNE_TEXTURES = [
                    // 0: Кордон (Щит)
                    makePixelTex(64, function (ctx, w, h) {
                        ctx.fillStyle = '#15181c';
                        ctx.fillRect(0, 0, w, h);
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 4;
                        ctx.strokeRect(10, 8, w - 20, h - 16);
                        ctx.beginPath();
                        ctx.moveTo(32, 10); ctx.lineTo(32, 54);
                        ctx.moveTo(18, 24); ctx.lineTo(32, 14); ctx.lineTo(46, 24);
                        ctx.moveTo(18, 40); ctx.lineTo(46, 28);
                        ctx.stroke();
                    }, 1, 1),
                    // 1: Урман (Древо)
                    makePixelTex(64, function (ctx, w, h) {
                        ctx.fillStyle = '#15181c';
                        ctx.fillRect(0, 0, w, h);
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.moveTo(32, 10); ctx.lineTo(32, 54);
                        ctx.moveTo(32, 18); ctx.lineTo(16, 30);
                        ctx.moveTo(32, 18); ctx.lineTo(48, 30);
                        ctx.moveTo(32, 32); ctx.lineTo(14, 44);
                        ctx.moveTo(32, 32); ctx.lineTo(50, 44);
                        ctx.moveTo(20, 54); ctx.lineTo(44, 54);
                        ctx.stroke();
                    }, 1, 1),
                    // 2: Живица (Око)
                    makePixelTex(64, function (ctx, w, h) {
                        ctx.fillStyle = '#15181c';
                        ctx.fillRect(0, 0, w, h);
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.moveTo(10, 32); ctx.lineTo(32, 16); ctx.lineTo(54, 32); ctx.lineTo(32, 48); ctx.closePath();
                        ctx.stroke();
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(28, 26, 8, 12);
                    }, 1, 1),
                    // 3: Путь (Стрела)
                    makePixelTex(64, function (ctx, w, h) {
                        ctx.fillStyle = '#15181c';
                        ctx.fillRect(0, 0, w, h);
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.moveTo(32, 10); ctx.lineTo(32, 54);
                        ctx.moveTo(16, 26); ctx.lineTo(32, 10); ctx.lineTo(48, 26);
                        ctx.moveTo(20, 42); ctx.lineTo(32, 30); ctx.lineTo(44, 42);
                        ctx.stroke();
                    }, 1, 1),
                    // 4: Скверна (Печать)
                    makePixelTex(64, function (ctx, w, h) {
                        ctx.fillStyle = '#15181c';
                        ctx.fillRect(0, 0, w, h);
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.arc(32, 32, 18, 0, Math.PI * 2);
                        ctx.moveTo(16, 16); ctx.lineTo(48, 48);
                        ctx.moveTo(48, 16); ctx.lineTo(16, 48);
                        ctx.stroke();
                    }, 1, 1)
                ];

                function getRuneVisual(symIdx, colIdx) {
                    const s = ((symIdx || 0) % RUNE_TEXTURES.length + RUNE_TEXTURES.length) % RUNE_TEXTURES.length;
                    const c = META.runes.colors[((colIdx || 0) % META.runes.colors.length + META.runes.colors.length) % META.runes.colors.length];
                    return { tex: RUNE_TEXTURES[s], hex: c.hex, css: c.css };
                }

                /* ---------------------------------------------------------
                   5.3 PS1 MATERIAL FACTORY (WITH PROGRAM CACHE KEY)
                   --------------------------------------------------------- */
                const ps1Uniforms = {
                    uJitter: { value: 0.0 },
                    uGrid: { value: new THREE.Vector2(160.0, 120.0) }
                };

                function makeMat(opts) {
                    const mat = new THREE.MeshStandardMaterial({
                        color: opts.color !== undefined ? opts.color : 0xffffff,
                        map: opts.map || null,
                        emissive: opts.emissive !== undefined ? opts.emissive : 0x000000,
                        emissiveIntensity: opts.emissiveIntensity !== undefined ? opts.emissiveIntensity : 0,
                        roughness: opts.roughness !== undefined ? opts.roughness : 0.88,
                        metalness: opts.metalness !== undefined ? opts.metalness : 0.06,
                        side: opts.doubleSide ? THREE.DoubleSide : THREE.FrontSide,
                        wireframe: state.view.wire
                    });

                    mat.customProgramCacheKey = function () {
                        return 'fktc_ps1_vertex_snap_v1';
                    };

                    mat.onBeforeCompile = function (shader) {
                        shader.uniforms.uJitter = ps1Uniforms.uJitter;
                        shader.uniforms.uGrid = ps1Uniforms.uGrid;
                        shader.vertexShader = 'uniform float uJitter;\nuniform vec2 uGrid;\n' + shader.vertexShader;
                        shader.vertexShader = shader.vertexShader.replace(
                            '#include <project_vertex>',
                            `
                            #include <project_vertex>
                            if (uJitter > 0.5) {
                                vec4 snapped = gl_Position;
                                snapped.xyz = gl_Position.xyz / gl_Position.w;
                                snapped.xy = floor(snapped.xy * uGrid + 0.5) / uGrid;
                                snapped.xyz *= gl_Position.w;
                                gl_Position = snapped;
                            }
                            `
                        );
                    };
                    return mat;
                }

                function envTint() {
                    if (state.envState === 'd') return 0x6b6764;
                    if (state.envState === 'c') return 0x7d7276;
                    return 0xffffff;
                }

                /* ---------------------------------------------------------
                   5.4 WINDING VERIFICATION & GEOMETRY BUILDERS
                   --------------------------------------------------------- */
                function closestPointOnSegment(p, a, b, out) {
                    const abx = b.x - a.x;
