<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Чернозёрье — Служитель Живицы v0.6</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#101416;color:#d8d0c4;overflow:hidden;font-family:ui-monospace,monospace}
canvas{display:block}#hud{position:fixed;z-index:4;top:12px;left:12px;max-width:335px;background:#0b1011e9;border:1px solid #685443;padding:16px;line-height:1.45;box-shadow:0 12px 32px #0005}
h1{color:#d69a6a;font-size:17px;letter-spacing:1.2px;margin:0 0 10px}button{font:inherit;background:#34241d;color:#f3dcc1;border:1px solid #795840;padding:9px 11px;margin:3px 4px 3px 0;cursor:pointer}button:focus-visible{outline:2px solid #ea9663}p{margin:8px 0}#status{color:#ffb378;min-height:21px}small{color:#a2a39d}#mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;color:#efaf73;opacity:.5}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
</head>
<body>
<div id="hud">
<h1>СЛУЖИТЕЛЬ ЧЁРНОЙ ЖИВИЦЫ</h1><small>ЧЕРНОЗЁРЬЕ / VISUAL TEST v0.6</small>
<p>Настоящая модель GLB: неровная ткань, тёмный капюшон, борода и состаренная ряса.</p>
<button id="idle">Ожидание</button><button id="patrol">Патруль</button><button id="alert">Тревога</button><button id="reset">Сброс</button>
<p id="status">Загрузка GLB…</p>
<small>ЛКМ — попадание, ПКМ / свайп — осмотр, колесо / щипок — масштаб. Отдельная сцена, не Godot-сборка.</small>
</div><div id="mark">+</div>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new T.Scene();scene.background=new T.Color(0x101719);scene.fog=new T.FogExp2(0x101719,.05);
const camera=new T.PerspectiveCamera(44,innerWidth/innerHeight,.05,150);camera.position.set(3.1,2.55,5.2);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1.15,0);orbit.enablePan=false;orbit.mouseButtons.RIGHT=T.MOUSE.ROTATE;orbit.minDistance=1.8;orbit.maxDistance=11;orbit.update();
scene.add(new T.HemisphereLight(0xbacdd1,0x191510,2));
const key=new T.DirectionalLight(0xffd0ac,3);key.position.set(-3,6,4);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
const rim=new T.DirectionalLight(0x749496,1.3);rim.position.set(2,3,-3);scene.add(rim);
const floor=new T.Mesh(new T.PlaneGeometry(150,150),new T.MeshStandardMaterial({color:0x353c3c,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
let seed=7382;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<95;i++){const x=(rand()-.5)*75,z=(rand()-.5)*75;if(Math.hypot(x,z)<7)continue;const h=4+rand()*3;const trunk=new T.Mesh(new T.CylinderGeometry(.09,.16,h,5),new T.MeshStandardMaterial({color:0x292a28}));trunk.position.set(x,h/2,z);scene.add(trunk);const crown=new T.Mesh(new T.ConeGeometry(1.15,h*.63,6),new T.MeshStandardMaterial({color:0x25342f,roughness:1}));crown.position.set(x,h*.72,z);scene.add(crown)}
const root=new T.Group(),actor=new T.Group();scene.add(root);root.add(actor);let meshes=[],pose='idle',pace=0,clockTime=0,hits=0,flash=[],fallen=false;
const status=document.getElementById('status');const hitRay=new T.Raycaster(),pointer=new T.Vector2();
const loader=new GLTFLoader();loader.load('./cultist_v06.glb',(gltf)=>{
const model=gltf.scene;
// trimesh stores Z as up; glTF loader gives Y-up. Normalize to the desired 1.85m character height.
const bounds=new T.Box3().setFromObject(model);const size=bounds.getSize(new T.Vector3());const factor=1.85/size.y;model.scale.setScalar(factor);model.updateWorldMatrix(true,true);
const box=new T.Box3().setFromObject(model);model.position.y=-box.min.y;model.position.x=-(box.min.x+box.max.x)/2;model.position.z=-(box.min.z+box.max.z)/2;
actor.add(model);model.traverse((obj)=>{if(obj.isMesh){obj.castShadow=true;obj.receiveShadow=true;meshes.push(obj);if(obj.material){obj.material.side=T.DoubleSide;obj.material.roughness=1;obj.material.metalness=0}}});
status.textContent='Модель v0.6 готова. Осмотри её со всех сторон.';
},undefined,(error)=>{status.textContent='GLB не загрузился: проверь сборку';console.error(error)});
function mode(s){if(fallen)return;pose=s;status.textContent=s==='patrol'?'ПАТРУЛЬ — медленное движение':s==='alert'?'ТРЕВОГА — ускоряется':'ОЖИДАНИЕ — осматривается'}
document.getElementById('idle').onclick=()=>mode('idle');
document.getElementById('patrol').onclick=()=>mode('patrol');
document.getElementById('alert').onclick=()=>mode('alert');
document.getElementById('reset').onclick=()=>{fallen=false;pose='idle';hits=0;root.position.set(0,0,0);actor.position.set(0,0,0);actor.rotation.set(0,0,0);status.textContent='Сброс: модель готова';};
renderer.domElement.addEventListener('pointerdown',(event)=>{
if(event.button!==0||!meshes.length)return;
const rect=renderer.domElement.getBoundingClientRect();pointer.set((event.clientX-rect.left)/rect.width*2-1,1-(event.clientY-rect.top)/rect.height*2);hitRay.setFromCamera(pointer,camera);const hit=hitRay.intersectObjects(meshes,false)[0];if(!hit){status.textContent='Промах';return}hits++;
let parent=hit.object,zone='Туловище';while(parent&&parent!==actor){if(['Head','Torso','LeftArm','RightArm','LeftLeg','RightLeg'].includes(parent.name)){zone=parent.name;break}parent=parent.parent}
status.textContent='Попадание: '+zone+' ('+hits+')';const obj=hit.object,original=obj.material;const glow=original.clone();glow.emissive=new T.Color(0x8b4b32);glow.emissiveIntensity=.6;obj.material=glow;flash.push({obj,original,t:.18});
if(hits>=7){fallen=true;status.textContent='Персонаж повержен. Нажми «Сброс»'}
});
const clock=new T.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);clockTime+=dt;
if(fallen){actor.rotation.z=T.MathUtils.damp(actor.rotation.z,1.2,3,dt)}
else {actor.rotation.z=T.MathUtils.damp(actor.rotation.z,0,4,dt);
if(pose==='patrol'||pose==='alert'){const speed=pose==='alert'?1.1:.7;pace+=dt*speed*6;const target=new T.Vector3(Math.floor(clockTime/5)%2===0?-1.5:1.5,0,0);const direction=target.sub(root.position);if(direction.length()>.2)root.position.addScaledVector(direction.normalize(),dt*speed);actor.position.y=Math.sin(pace*2)*.02;actor.rotation.y=T.MathUtils.damp(actor.rotation.y,Math.sin(clockTime*.35)*.45,2,dt)}
else{actor.position.y=T.MathUtils.damp(actor.position.y,0,4,dt);actor.rotation.y=Math.sin(clockTime*.38)*.08}}
for(let i=flash.length-1;i>=0;i--){const f=flash[i];f.t-=dt;if(f.t<=0){f.obj.material=f.original;flash.splice(i,1)}}
orbit.update();renderer.render(scene,camera)}animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
