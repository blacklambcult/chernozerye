name: Build and deploy Chernozerye (Godot Web)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python for manual map import
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Convert user Geo Lab survey to Godot coordinates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pyproj>=3.6,<4'
          python scripts/convert_editor_geojson.py data/manual_survey_2026-11-18.geojson --output godot/manual_layout.json
          python - <<'PY'
          import json
          d = json.load(open('godot/manual_layout.json', encoding='utf-8'))
          assert len(d['features']) == 314
          assert d['metadata']['type_counts']['house'] == 92
          assert d['metadata']['type_counts']['plot'] == 88
          print('MANUAL_SOURCE_VERIFIED:', len(d['features']))
          PY

      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION="4.7.2"
          RELEASE="https://github.com/godotengine/godot-builds/releases/download/${VERSION}-stable"
          curl -fL --retry 3 -o /tmp/godot.zip "${RELEASE}/Godot_v${VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 755 "/tmp/godot-bin/Godot_v${VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz "${RELEASE}/Godot_v${VERSION}-stable_export_templates.tpz"
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"
          godot --version

      - name: Import project
        run: godot --headless --path godot --editor --quit

      - name: Validate GDScript sources
        shell: bash
        run: |
          set -euo pipefail
          for script in world.gd player.gd geography_v07.gd live_map_v08.gd overture_3d_a.gd manual_geo.gd manual_art.gd izba_variants.gd logo_data.gd; do
            echo "Checking ${script}"
            godot --headless --path godot --check-only --script "res://${script}"
          done

      - name: Smoke-test actual scene startup
        shell: bash
        run: |
          set -euo pipefail
          # Script validation alone cannot catch a Web scene frozen in _ready.
          timeout 45s godot --headless --path godot --quit-after 20 2>&1 | tee /tmp/world-smoke.log
          grep -q "WORLD_READY: geometry complete" /tmp/world-smoke.log
          grep -q "OVERTURE_3D_A_READY:" /tmp/world-smoke.log
          grep -q "MANUAL_LAYOUT_READY: 314" /tmp/world-smoke.log
          grep -q "MANUAL_ART_READY: buildings=162 plots=88 roads=18" /tmp/world-smoke.log
          grep -q "MANUAL_VILLAGE_DETAIL_READY: canopies=" /tmp/world-smoke.log
          grep -q "MANUAL_FACADE_READY: lean_tos=" /tmp/world-smoke.log
          grep -q "IZBA_GENERATOR_READY: floor_counts=" /tmp/world-smoke.log
          grep -q "IZBA_DETAIL_READY: log_courses=" /tmp/world-smoke.log
          grep -q "VILLAGE_YARDS_READY: wells=" /tmp/world-smoke.log
          grep -q "VILLAGE_CLEARANCE_READY: rejected_fence_panels=" /tmp/world-smoke.log
          grep -q "CHERNOZERYE_LOGO_READY:" /tmp/world-smoke.log
          # Guard against removing most plot boundaries again (v3.4 skipped 328).
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/world-smoke.log').read_text()
          m = re.search(
              r'VILLAGE_CLEARANCE_READY: rejected_fence_panels=(\d+)'
              r' total_fence_panels=(\d+) relocated_fence_panels=(\d+)'
              r'.* sealed_roof_joints=(\d+)',
              log)
          assert m, 'Missing village geometry counts'
          missing, attempted, relocated, sealed = map(int, m.groups())
          assert attempted > 0, 'No fence panels attempted'
          assert missing / attempted < 0.55, ('Most fence sections were lost', missing, attempted)
          assert relocated > 20, ('No roadside fence correction performed', relocated)
          assert sealed == 92, ('Unexpected house roof count', sealed)
          print('VILLAGE_GEOMETRY_AUDIT_OK:', missing, attempted, relocated, sealed)
          PY
          # The new lighting mode is enabled only after the player selects the manual village.
          # Assert its configuration statically; startup smoke has not clicked that button.
          grep -q 'ambient_light_energy = 0.48 if manual_mode' godot/world.gd
          grep -q 'light_specular = 0.0' godot/world.gd
          grep -q "MANUAL_FOREST_READY: trees=" /tmp/world-smoke.log
          grep -q "clearance=roads13/buildings6.5" /tmp/world-smoke.log
          grep -q "MANUAL_SHOWCASE_YARD_READY:" /tmp/world-smoke.log
          grep -q "MANUAL_UTILITY_READY: poles=" /tmp/world-smoke.log
          if grep -E "SCRIPT ERROR|FATAL ERROR|out of memory" /tmp/world-smoke.log; then
            exit 1
          fi

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          # Versioned asset directory prevents stale .wasm/.pck files in browsers.
          mkdir -p build/web/v37
          godot --headless --path godot --export-release "Web" "$(pwd)/build/web/v37/index.html"
          test -s build/web/v37/index.html
          test -f build/web/v37/index.wasm
          test -f build/web/v37/index.pck
          cat > build/web/index.html <<'HTML'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=./v37/">
            <title>Чернозёрье — загрузка новой версии</title>
          </head>
          <body>
            <p><a href="./v37/">Открыть Чернозёрье 3.7</a></p>
            <script>window.location.replace("./v37/");</script>
          </body>
          </html>
          HTML
          touch build/web/.nojekyll

      - name: Prepare the satellite geography viewer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build satellite overlay data and audit frontend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pyproj>=3.6,<4'
          python -m py_compile scripts/build_geo_viewer.py scripts/convert_editor_geojson.py
          python scripts/convert_editor_geojson.py tests/geo_lab_sample.geojson --output /tmp/chernozerye-manual-test.json
          python - <<'PY'
          import json
          doc = json.load(open('/tmp/chernozerye-manual-test.json', encoding='utf-8'))
          assert doc['metadata']['projection'] == 'EPSG:32640'
          assert len(doc['features']) == 3
          assert doc['metadata']['type_counts'] == {'road': 1, 'plot': 1, 'car': 1}
          center = next(x for x in doc['features'] if x['type'] == 'car')['points'][0]
          assert abs(center[0]) < .02 and abs(center[1]) < .02, center
          print('MANUAL_GODOT_IMPORT_OK:', len(doc['features']))
          PY
          node --check site/map/app.js
          node --check site/map/editor-core.js
          node --check site/map/editor.js
          node --test tests/editor-core.test.cjs
          grep -q 'editor.js?v=20' site/map/index.html
          grep -q 'editor-core.js?v=20' site/map/index.html
          mkdir -p build/web/map
          cp -a site/map/. build/web/map/
          python scripts/build_geo_viewer.py
          test -s build/web/map/index.html
          test -s build/web/map/data/overture.geojson
          test -s build/web/map/data/roads.geojson
          test -s build/web/map/data/study-areas.geojson
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/web/map/data")
          features = json.loads((root/"overture.geojson").read_text())["features"]
          roads = json.loads((root/"roads.geojson").read_text())["features"]
          assert len(features) >= 1000, "Unexpected building count"
          assert len(roads) >= 10, "No roads"
          for feature in features:
              geom = feature["geometry"]
              assert geom["type"] == "Polygon"
              for lon, lat in geom["coordinates"][0]:
                  assert 55.7 < lon < 56.0 and 54.5 < lat < 54.9, "Invalid WGS84 coordinate"
          print("MAP_GEO_AUDIT_OK:", len(features), "building footprints,", len(roads), "roads")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: export
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
