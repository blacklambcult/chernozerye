                let currentRoot = null;
                let mixer = null;
                let mysticClips = [];
                let fullCycleTimers = [];

                function clearCycleTimers() {
                    for (let i = 0; i < fullCycleTimers.length; i++) clearTimeout(fullCycleTimers[i]);
                    fullCycleTimers = [];
                }

                function disposeTree(obj) {
                    if (!obj) return;
                    obj.traverse(function (ch) {
                        if (ch.geometry) ch.geometry.dispose();
                        if (ch.material) {
                            if (Array.isArray(ch.material)) ch.material.forEach(function (m) { m.dispose(); });
                            else ch.material.dispose();
                        }
                    });
                }

                function updatePolyCount(obj) {
                    let tris = 0;
                    obj.traverse(function (o) {
                        if (o.isMesh && o.geometry) {
                            if (o.geometry.index) tris += o.geometry.index.count / 3;
                            else if (o.geometry.attributes.position) tris += o.geometry.attributes.position.count / 3;
                        }
                    });
                    const el = document.getElementById('poly-counter');
                    if (el) el.textContent = Math.round(tris) + ' tris • Y=0';
                }

                function playMysticClip(name, loopMode, onDone) {
                    if (!mixer) return;
                    const clip = mysticClips.find(function (c) { return c.name === name; });
                    if (!clip) return;
                    mixer.stopAllAction();
                    const act = mixer.clipAction(clip);
                    act.reset();
                    if (loopMode === 'loop') {
                        act.setLoop(THREE.LoopRepeat, Infinity);
                        act.clampWhenFinished = false;
                    } else {
                        act.setLoop(THREE.LoopOnce, 1);
                        act.clampWhenFinished = true;
                    }
                    act.play();
                    if (onDone) {
                        const tid = setTimeout(onDone, clip.duration * 1000);
                        fullCycleTimers.push(tid);
                    }
                }

                triggerMysticLifecycle = function (cmd) {
                    clearCycleTimers();
                    state.mystic.activeLc = cmd;

                    if (cmd === 'Reset_Inactive') {
                        state.mystic.altarState = 'inactive';
                        syncUI();
                        playMysticClip('Reset_Inactive', 'once');
                    } else if (cmd === 'Activate') {
                        state.mystic.altarState = 'active';
                        syncUI();
                        playMysticClip('Activate', 'once', function () {
                            state.mystic.activeLc = 'Ritual_Idle';
                            syncUI();
                            playMysticClip('Ritual_Idle', 'loop');
                        });
                    } else if (cmd === 'Ritual_Idle') {
                        state.mystic.altarState = 'active';
                        syncUI();
                        playMysticClip('Ritual_Idle', 'loop');
                    } else if (cmd === 'Anomaly_Pulse') {
                        state.mystic.altarState = 'active';
                        syncUI();
                        playMysticClip('Anomaly_Pulse', 'once', function () {
                            state.mystic.activeLc = 'Ritual_Idle';
                            syncUI();
                            playMysticClip('Ritual_Idle', 'loop');
                        });
                    } else if (cmd === 'Destroy') {
                        state.mystic.altarState = 'broken';
                        syncUI();
                        playMysticClip('Destroy', 'once');
                    } else if (cmd === 'Broken_Static') {
                        state.mystic.altarState = 'broken';
                        syncUI();
                        rebuildScene();
                    } else if (cmd === 'Full_Cycle') {
                        state.mystic.altarState = 'inactive';
                        syncUI();
                        playMysticClip('Reset_Inactive', 'once', function () {
                            state.mystic.altarState = 'active';
                            state.mystic.activeLc = 'Activate';
                            syncUI();
                            playMysticClip('Activate', 'once', function () {
                                state.mystic.activeLc = 'Ritual_Idle';
                                syncUI();
                                playMysticClip('Ritual_Idle', 'loop');
                                const tid = setTimeout(function () {
                                    state.mystic.altarState = 'broken';
                                    state.mystic.activeLc = 'Destroy';
                                    syncUI();
                                    playMysticClip('Destroy', 'once', function () {
                                        state.mystic.activeLc = 'Broken_Static';
                                        syncUI();
                                    });
                                }, 2400);
                                fullCycleTimers.push(tid);
                            });
                        });
                    }
                };

                rebuildScene = function () {
                    try {
                        clearCycleTimers();
                        if (mixer) {
                            mixer.stopAllAction();
                            mixer = null;
                        }
                        if (currentRoot) {
                            scene.remove(currentRoot);
                            disposeTree(currentRoot);
                            currentRoot = null;
                        }
                        pulsingSapMeshes = [];
                        pulsingRuneMeshes = [];
                        flickerCandles = [];
                        mysticClips = [];

                        const c = state.cat;
                        if (c === 'tree') currentRoot = buildTree();
                        else if (c === 'bush') currentRoot = buildBush();
                        else if (c === 'rock') currentRoot = buildRockStump();
                        else if (c === 'water') currentRoot = buildWaterTile();
                        else currentRoot = buildMysticShrine();

                        scene.add(currentRoot);
                        updatePolyCount(currentRoot);

                        if (c === 'mystic') {
                            mixer = new THREE.AnimationMixer(currentRoot);
                            mysticClips = buildMysticClips(currentRoot);
                            if (state.mystic.altarState === 'active') {
                                playMysticClip('Ritual_Idle', 'loop');
                            }
                        }

                        applyViewSettings();
                    } catch (err) {
                        reportFatalError('ОШИБКА СБОРКИ СЦЕНЫ', err && err.message ? err.message : String(err));
                    }
                };

                /* ---------------------------------------------------------
                   5.11 PS1 VIEW SETTINGS & BINARY .GLB EXPORT FOR GODOT 4
                   --------------------------------------------------------- */
                function handleResize() {
                    if (!renderer) return;
                    const w = Math.max(1, window.innerWidth);
                    const h = Math.max(1, window.innerHeight);
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();

                    if (state.view.pixel) {
                        const scale = 0.28;
                        renderer.setPixelRatio(1);
                        renderer.setSize(Math.max(160, Math.floor(w * scale)), Math.max(120, Math.floor(h * scale)), false);
                        canvas.classList.add('pixelated');
                    } else {
                        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                        renderer.setSize(w, h, false);
                        canvas.classList.remove('pixelated');
                    }
                }

                applyViewSettings = function () {
                    const v = state.view;
                    ps1Uniforms.uJitter.value = v.jitter ? 1.0 : 0.0;
                    const gridW = Math.round(240 - v.jitterStrength * 16);
                    ps1Uniforms.uGrid.value.set(gridW, Math.round(gridW * 0.75));
                    document.getElementById('vhs-overlay').classList.toggle('active', v.vhs);
                    tileGridOverlay.visible = state.showTileGrid;

                    scene.traverse(function (o) {
                        if (o.isMesh && o.material) {
                            const mats = Array.isArray(o.material) ? o.material : [o.material];
                            mats.forEach(function (m) { m.wireframe = v.wire; });
                        }
                    });

                    if (v.nightFog) {
                        scene.fog = new THREE.FogExp2(0x070b0d, 0.095);
                        renderer?.setClearColor(0x070b0d, 1);
                        hemiLight.intensity = 0.26;
                        sunLight.intensity = 0.36;
                        sunLight.color.setHex(0x6d8ca8);
                        rimLight.intensity = 0.18;
                    } else {
                        scene.fog = null;
                        renderer?.setClearColor(0x13151a, 1);
                        hemiLight.intensity = 0.98;
                        sunLight.intensity = 1.15;
                        sunLight.color.setHex(0xfff4e4);
                        rimLight.intensity = 0.50;
                    }
                    handleResize();
                };

                async function exportNature(includeGround) {
                    if (!THREE.GLTFExporter) throw new Error('GLTFExporter не загружен');
                    if (!currentRoot) throw new Error('Нет модели для экспорта');

                    let target = currentRoot.clone(true);
                    if (includeGround) {
                        const wrapper = new THREE.Group();
                        wrapper.name = target.name + '_WithGround';
                        wrapper.add(target, groundGroup.clone(true));
                        target = wrapper;
                    }

                    const materials = new Map();
                    function solidMaterial(source) {
                        if (!materials.has(source)) {
                            const copy = source.clone();
                            copy.wireframe = false;
                            materials.set(source, copy);
                        }
                        return materials.get(source);
                    }
                    target.traverse(node => {
                        if (!node.isMesh || !node.material) return;
                        node.material = Array.isArray(node.material)
                            ? node.material.map(solidMaterial) : solidMaterial(node.material);
                    });
                    const options = { binary: true, animations: state.cat === 'mystic' ? mysticClips : [] };
                    try {
                        return await new Promise((resolve, reject) => {
                            new THREE.GLTFExporter().parse(target, result => {
                                if (!(result instanceof ArrayBuffer)) {
                                    reject(new Error('Не получен бинарный GLB'));
                                    return;
                                }
                                resolve(new Blob([result], { type: 'model/gltf-binary' }));
                            }, options);
                        });
                    } finally {
                        materials.forEach(material => material.dispose());
                    }
                }

                exportGLB = async function () {
                    try {
                        const name = getConfigCode() + '.glb';
                        const blob = await exportNature(!state.onlyObject);
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = name;
                        document.body.appendChild(link);
                        link.click();
                        link.remove();
                        setTimeout(() => URL.revokeObjectURL(url), 300);
                        showToast('Сохранено для Godot 4: ' + name, false);
                    } catch (error) {
                        showToast('Ошибка экспорта GLB: ' + error.message, true);
                    }
                };

                const saveButton = document.getElementById('btn-save-nature');
                const placeButton = document.getElementById('btn-place-nature');
                const categoryNames = { tree: 'Дерево', bush: 'Кусты', rock: 'Камни и пни',
                    water: 'Водный тайл', mystic: 'Мистический объект' };
                let lastSaved = null;
                async function saveNature(place) {
                    saveButton.disabled = placeButton.disabled = true;
                    try {
                        const category = state.cat;
                        const recipe = { version: 1, category, environment: state.envState,
                            parameters: { ...state[category] } };
                        const name = document.getElementById('nature-name').value.trim() ||
                            categoryNames[category] + ' · ' + getConfigCode();
                        const key = JSON.stringify([name, recipe]);
                        let id = lastSaved?.key === key ? lastSaved.id : null;
                        if (!id) {
                            const blob = await exportNature(false);
                            id = 'nature-' + crypto.randomUUID();
                            await window.ChernoObjectLibrary.saveModel({
                                id, name, blob, recipe, kind: 'nature', source: 'nature-generator',
                                updatedAt: new Date().toISOString()
                            });
                            lastSaved = { key, id };
                        }
                        if (!place) {
                            showToast('В библиотеке: ' + name, false);
                            return;
                        }
                        const url = new URL('../quest/', location.href);
                        url.searchParams.set('model', id);
                        const link = document.createElement('a');
                        link.href = url.href;
                        link.hidden = true;
                        document.body.appendChild(link);
                        link.click();
                        link.remove();
                    } catch (error) {
                        showToast('Не удалось сохранить модель: ' + error.message, true);
                    } finally {
                        saveButton.disabled = placeButton.disabled = false;
                    }
                }

                saveButton.addEventListener('click', () => saveNature(false));
                placeButton.addEventListener('click', () => saveNature(true));
                saveButton.disabled = placeButton.disabled = !THREE.GLTFExporter;

                /* ---------------------------------------------------------
                   5.12 INITIAL BUILD & MAIN ANIMATION LOOP
                   --------------------------------------------------------- */
                rebuildScene();
                resetCamera();
                handleResize();
                setStatus('ready', renderer ? 'WEBGL ГОТОВ // УРМАН, НОЯБРЬ 2005' : 'ГЕНЕРАТОР ГОТОВ БЕЗ 3D-ПРЕДПРОСМОТРА');

                const clock = new THREE.Clock();
                let lastW = 0, lastH = 0;
                let animCrashed = false;

                function animate() {
                    if (animCrashed) return;
                    requestAnimationFrame(animate);
                    try {
                        const dt = Math.min(clock.getDelta(), 0.08);
                        const elapsed = clock.getElapsedTime();

                        const cw = window.innerWidth, ch = window.innerHeight;
                        if (cw > 0 && ch > 0 && (cw !== lastW || ch !== lastH)) {
                            lastW = cw;
                            lastH = ch;
                            handleResize();
                        }

                        if (mixer) mixer.update(dt);

                        // Preview shrine & runic stone illumination (never exported)
                        if (state.cat === 'mystic' && state.mystic.altarState === 'active') {
                            const rv = getRuneVisual(state.mystic.runeSym, state.mystic.runeCol);
                            shrinePreviewLight.color.setHex(rv.hex);
                            shrinePreviewLight.position.set(0, 1.35, 0.45);
                            shrinePreviewLight.intensity = 1.55 + Math.sin(elapsed * 4.5) * 0.25;
                        } else if (state.cat === 'rock' && state.rock.species === 4) {
                            const rv = getRuneVisual(state.rock.runeSym, state.rock.runeCol);
                            shrinePreviewLight.color.setHex(rv.hex);
                            shrinePreviewLight.position.set(0, 0.75, 0.55);
                            shrinePreviewLight.intensity = 1.15 + Math.sin(elapsed * 3.8) * 0.20;
                        } else {
                            shrinePreviewLight.intensity = 0;
                        }

                        // Subtle emissive breathing on Runic Boundary Stone
                        if (pulsingRuneMeshes.length > 0) {
                            const ePulse = 1.45 + Math.sin(elapsed * 3.8) * 0.35;
                            for (let i = 0; i < pulsingRuneMeshes.length; i++) {
                                if (pulsingRuneMeshes[i].material) {
                                    pulsingRuneMeshes[i].material.emissiveIntensity = ePulse;
                                }
                            }
                        }

                        // Candle flame flicker
                        if (flickerCandles.length > 0) {
                            for (let i = 0; i < flickerCandles.length; i++) {
                                const fl = 0.88 + Math.sin(elapsed * 14 + i * 2.1) * 0.16;
                                flickerCandles[i].scale.set(1, fl, 1);
                            }
                        }

                        // Pulsing Black Sap nodes/vines
                        if (pulsingSapMeshes.length > 0) {
                            const p = 1.0 + Math.sin(elapsed * 2.6) * 0.05;
                            for (let i = 0; i < pulsingSapMeshes.length; i++) {
                                pulsingSapMeshes[i].scale.set(p, 1, p);
                            }
                        }

                        if (state.view.autoRotate && orbit.mode === 'none') {
                            orbit.desiredTheta += dt * 0.42;
                        }

                        const damp = 1 - Math.exp(-10 * dt);
                        orbit.theta += (orbit.desiredTheta - orbit.theta) * damp;
                        orbit.phi += (orbit.desiredPhi - orbit.phi) * damp;
                        orbit.radius += (orbit.desiredRadius - orbit.radius) * damp;
                        orbit.target.lerp(orbit.desiredTarget, damp);
                        updateCameraTransform();

                        renderer.render(scene, camera);
                    } catch (err) {
                        animCrashed = true;
                        reportFatalError('ОШИБКА РЕНДЕРА', err && err.message ? err.message : String(err));
                    }
                }

                if (renderer) animate();
            }

            let engineBooted = false;
            function safeBoot() {
                if (engineBooted) return;
                engineBooted = true;
                bootEngine();
            }

            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                safeBoot();
            } else {
                document.addEventListener('DOMContentLoaded', safeBoot);
                window.addEventListener('load', safeBoot);
            }
        })();
    </script>
</body>
</html>
