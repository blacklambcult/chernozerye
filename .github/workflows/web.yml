      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload web build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: export
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Pages entry and active game build
        shell: bash
        env:
          RELEASE_DIR: ${{ needs.export.outputs.release_dir }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          # Deployment success only confirms artifact upload. Verify the live
          # HTTP endpoint and the exact hash-specific Godot directory as well.
          SITE_URL="${SITE_URL%/}/"
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 20 --retry 2 --retry-delay 2 "${SITE_URL}?build=${GITHUB_SHA:0:8}" -o /tmp/pages-root.html \
              && grep -Fq "url=./${RELEASE_DIR}/" /tmp/pages-root.html \
              && curl -fsSL --max-time 20 "${SITE_URL}${RELEASE_DIR}/index.html" -o /tmp/pages-game.html \
              && test -s /tmp/pages-game.html \
              && curl -fsSL --max-time 20 "${SITE_URL}quest/index.html" -o /tmp/pages-quest.html \
              && grep -q 'QUEST LAB' /tmp/pages-quest.html \
              && curl -fsSL --max-time 20 "${SITE_URL}model/index.html" -o /tmp/pages-model.html \
              && grep -q 'MODEL LAB' /tmp/pages-model.html \
              && curl -fsSL --max-time 20 "${SITE_URL}forge/index.html" -o /tmp/pages-forge.html \
              && grep -q 'HELLISH FORGE' /tmp/pages-forge.html \
              && curl -fsSL --max-time 20 "${SITE_URL}forge/forge-core.js" -o /tmp/pages-forge-core.js \
              && grep -q 'chernozerye.hellish-forge' /tmp/pages-forge-core.js \
              && curl -fsSL --max-time 20 "${SITE_URL}weapon-generator/index.html" -o /tmp/pages-weapon-generator.html \
              && grep -q 'WEAPON GENERATOR\|Генератор Оружия' /tmp/pages-weapon-generator.html \
              && curl -fsSL --max-time 20 "${SITE_URL}building-generator/index.html" -o /tmp/pages-building-generator.html \
              && grep -q 'id="btn-save-building"' /tmp/pages-building-generator.html \
              && curl -fsSL --max-time 20 "${SITE_URL}nature-generator/index.html" -o /tmp/pages-nature-generator.html \
              && grep -q 'id="btn-save-nature"' /tmp/pages-nature-generator.html \
              && curl -fsSL --max-time 20 "${SITE_URL}arms/index.html" -o /tmp/pages-arms.html \
              && grep -q 'id="arms-weapon"' /tmp/pages-arms.html \
              && curl -fsSL --max-time 20 "${SITE_URL}studio/index.html" -o /tmp/pages-studio.html \
              && grep -q 'CHERNOZERYE' /tmp/pages-studio.html \
              && curl -fsSL --max-time 20 "${SITE_URL}studio/studio.js" -o /tmp/pages-studio.js \
              && grep -q 'CHERNOZERYE_STUDIO_READY' /tmp/pages-studio.js \
              && curl -fsSL --max-time 20 "${SITE_URL}studio/releases.json" -o /tmp/pages-studio-releases.json \
              && grep -q '"studio": "0.6.2"' /tmp/pages-studio-releases.json \
              && curl -fsSL --max-time 20 "${SITE_URL}studio/build-meta.json" -o /tmp/pages-studio-build-meta.json \
              && grep -q "${GITHUB_SHA}" /tmp/pages-studio-build-meta.json \
              && curl -fsSL --max-time 20 "${SITE_URL}studio/commit-history.json" -o /tmp/pages-studio-history.json \
              && python -c 'import json, os; d=json.load(open("/tmp/pages-studio-history.json")); assert d["head"]==os.environ["GITHUB_SHA"] and len(d["entries"])>0'; then
              echo "LIVE_PAGES_OK: ${SITE_URL}, ${SITE_URL}${RELEASE_DIR}/, geo/, quest/, model/, forge/, weapon-generator/, studio/"
              exit 0
            fi
            echo "Public Pages check ${attempt}/12 not ready"
            sleep 5
          done
          echo "::error::GitHub Pages deployed but its public index or game build returned 404"
          exit 1
